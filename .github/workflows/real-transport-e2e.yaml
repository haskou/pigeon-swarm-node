name: Real Transport E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: real-transport-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

# One step per script, each with a timeout, so a hang names the script.
# `yarn test:e2e:real-transport` is the local equivalent of all of them.
#
# `changes` decides whether the jobs below run. Documentation-only changes skip
# them; skipped jobs keep their names, so required checks still report. Workflow
# and action changes always run everything. See .github/actions/classify-changes.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        uses: ./.github/actions/classify-changes

  real-transport:
    name: Real transport scripts
    needs: changes
    if: always() && needs.changes.outputs.heavy != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Conversation
        run: yarn test:e2e:real-transport:conversation
        timeout-minutes: 5

      - name: Device authorization
        run: yarn test:e2e:real-transport:device-authorization
        timeout-minutes: 4

      - name: Private authorization
        run: yarn test:e2e:real-transport:private-authorization
        timeout-minutes: 4

      - name: Private IPFS relay
        run: yarn test:e2e:real-transport:private-ipfs-relay
        timeout-minutes: 4

      - name: Private relay discovery
        run: yarn test:e2e:real-transport:private-relay-discovery
        timeout-minutes: 4

      - name: Private relay mesh
        run: yarn test:e2e:real-transport:private-relay-mesh
        timeout-minutes: 5

      - name: Private OrbitDB spike
        run: yarn test:e2e:real-transport:orbitdb-spike
        timeout-minutes: 4

      - name: Mailbox realtime hint
        run: yarn test:e2e:real-transport:mailbox-realtime
        timeout-minutes: 4

      - name: Realtime ticket upgrade
        run: yarn test:e2e:real-transport:realtime-ticket
        timeout-minutes: 4

      - name: Mailbox two-node proof
        run: yarn test:e2e:real-transport:mailbox-two-node
        timeout-minutes: 4

      - name: Two-node private blob availability proof
        run: yarn test:e2e:real-transport:private-blob-availability
        timeout-minutes: 4

      - name: Read-until receipt proof
        run: yarn test:e2e:real-transport:read-until
        timeout-minutes: 4

  turn:
    name: Backend credentials against coturn
    needs: changes
    if: always() && needs.changes.outputs.heavy != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Pull coturn image
        run: docker pull coturn/coturn:4.11.0-r0-alpine
        timeout-minutes: 5

      - name: TURN credentials
        run: yarn test:e2e:turn-credentials
        timeout-minutes: 4

      - name: TURN federation
        run: yarn test:e2e:turn-federation
        timeout-minutes: 4
