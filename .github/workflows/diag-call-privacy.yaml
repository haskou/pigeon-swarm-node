name: Diag call privacy

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read
  packages: read

jobs:
  call-privacy:
    name: Call privacy sample ${{ matrix.sample }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Call privacy
        run: yarn test:integration:call-privacy
        timeout-minutes: 6
