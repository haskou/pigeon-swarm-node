name: Node.js CI

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read
  packages: read

# Every job installs from the shared yarn cache and runs independently. Every
# script runs in its own step with a timeout, so a hang fails fast and names the
# script instead of consuming the job limit. `yarn test:ci` remains the local
# equivalent of the test jobs below.
#
# `changes` decides whether the heavy jobs run. Documentation-only changes skip
# them; skipped jobs keep their names, so required checks still report. Workflow
# and action changes always run everything. See .github/actions/classify-changes.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        uses: ./.github/actions/classify-changes

  static:
    name: Static checks
    needs: changes
    if: always() && needs.changes.outputs.heavy != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Lint
        run: yarn lint
        timeout-minutes: 5

      - name: Typecheck
        run: yarn typecheck
        timeout-minutes: 5

      - name: Build
        run: yarn build
        timeout-minutes: 5

      - name: Compiled boot with CONTAINER_BUILD=true
        run: yarn test:e2e:container:compiled-boot
        timeout-minutes: 3

      - name: Init failure exits with status 1
        run: yarn test:e2e:container:init-failure
        timeout-minutes: 3

  unit:
    name: Unit tests
    needs: changes
    if: always() && needs.changes.outputs.heavy != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Unit tests (all but the device authorization repository spec)
        run: yarn test:unit:rest
        timeout-minutes: 10

  unit-device-authorization:
    name: Device authorization repository spec
    needs: changes
    if: always() && needs.changes.outputs.heavy != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Unit tests (device authorization repository spec)
        run: yarn test:unit:device-authorization-repository
        timeout-minutes: 15

  cucumber:
    name: Cucumber suites
    needs: changes
    if: always() && needs.changes.outputs.heavy != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: API
        run: yarn test:api
        timeout-minutes: 8

      - name: API with real IPFS
        run: yarn test:api:real-ipfs
        timeout-minutes: 5

      - name: Consumer
        run: yarn test:consumer
        timeout-minutes: 5

      - name: Scheduler
        run: yarn test:scheduler
        timeout-minutes: 5

  container:
    name: Container image (non-root smoke)
    needs: changes
    if: always() && needs.changes.outputs.heavy != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Private blob container smoke
        run: yarn test:e2e:container:private-blob
        timeout-minutes: 12

  integration:
    name: In-process integration scripts
    needs: changes
    if: always() && needs.changes.outputs.heavy != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Forged public mutations
        run: yarn test:integration:forged-public-mutations
        timeout-minutes: 4

      - name: Forged community operations
        run: yarn test:integration:forged-community-operations
        timeout-minutes: 4

      - name: Forged conversations
        run: yarn test:integration:forged-conversations
        timeout-minutes: 4

      - name: Forged content replication
        run: yarn test:integration:forged-content-replication
        timeout-minutes: 4

      - name: Forged notifications
        run: yarn test:integration:forged-notifications
        timeout-minutes: 4

      - name: Forged calls
        run: yarn test:integration:forged-calls
        timeout-minutes: 4

      - name: Forged keychains
        run: yarn test:integration:forged-keychains
        timeout-minutes: 4

      - name: Forged identities
        run: yarn test:integration:forged-identities
        timeout-minutes: 4

      - name: Causal device authorization
        run: yarn test:integration:causal-device-authorization
        timeout-minutes: 4

      - name: Call history
        run: yarn test:integration:call-history
        timeout-minutes: 4

      - name: Call privacy
        run: yarn test:integration:call-privacy
        timeout-minutes: 4

      - name: Network reconfiguration
        run: yarn test:integration:network-reconfiguration
        timeout-minutes: 4

      - name: OrbitDB heads framing
        run: yarn test:integration:orbitdb-heads-framing
        timeout-minutes: 4

      - name: Mailbox realtime hint
        run: yarn test:e2e:real-transport:mailbox-realtime
        timeout-minutes: 4

      - name: Realtime ticket upgrade
        run: yarn test:e2e:real-transport:realtime-ticket
        timeout-minutes: 4

      - name: Mailbox two-node proof
        run: yarn test:e2e:real-transport:mailbox-two-node
        timeout-minutes: 4

      - name: Two-node private blob availability proof
        run: yarn test:e2e:real-transport:private-blob-availability
        timeout-minutes: 4

      - name: Read-until receipt proof
        run: yarn test:e2e:real-transport:read-until
        timeout-minutes: 4
