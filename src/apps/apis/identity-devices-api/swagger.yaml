openapi: 3.0.3
info:
  title: Pigeon Swarm identity device authorization API
  version: 1.0.0
paths:
  /identity-devices/{identityId}:
    get:
      tags:
        - identity-devices
      summary: Read the authenticated identity authorization checkpoint
      description: |
        Returns the current recovery epoch, deterministic revision and the
        compromise caps in effect (compromisedCredentials) for the authenticated
        identity. The path identity must equal the identity
        that signed the HTTP request. A client performing total device recovery
        authenticates with the recovered stable identity signing key and the
        separate recovery authority.

        The response never exposes the authorized-device list (see
        /identity-devices/{identityId}/devices), credential commitments, password material, recovery secrets or private keys.

        Existing devices send X-Device-Credential and X-Device-Signature
        together. The device signature covers the same canonical request as
        X-Signature, and the credential must belong to the current checkpoint.
        Total recovery omits both device headers and sends X-Recovery-Signature.
        The device or recovery proof must carry an X-Timestamp within 30 seconds
        of the node clock and is accepted once: a replayed proof signature,
        under any encoding of the same key, is refused. A proof takes its
        replay slot only once the device is authorized or the key is the
        recovery authority. The record is in memory and per node, so within
        the 60 second window a proof can be accepted once more on another node
        or after a restart. Clients sign every read anew.
      parameters:
        - in: path
          name: identityId
          required: true
          schema:
            type: string
          description: Percent-encoded identity id. It must equal X-Identity-Id.
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/XDeviceCredential'
        - $ref: '#/components/parameters/XDeviceSignature'
        - $ref: '#/components/parameters/XRecoverySignature'
      operationId: getIdentityDevicesByIdentityId
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Current deterministic authorization checkpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorization'
        '401':
          description: The signature is missing, invalid or stale, the signer does not own the requested identity, the supplied device credential is not currently authorized, or the device or recovery proof was already used (code 401020).
        '409':
          description: The authorization checkpoint is unavailable on this node.
  /identity-devices/{identityId}/devices:
    get:
      tags:
        - identity-devices
      summary: List the authorized device credentials of the authenticated identity
      description: |
        Owner-only. Authentication is identical to the checkpoint read: the path
        identity must equal the signing identity and exactly one complete device
        or recovery proof is required. Returns the public credentials authorized
        at the current head; no labels, commitments, revoked credentials or
        revocation history.
      parameters:
        - in: path
          name: identityId
          required: true
          schema:
            type: string
          description: Percent-encoded identity id. It must equal X-Identity-Id.
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/XDeviceCredential'
        - $ref: '#/components/parameters/XDeviceSignature'
        - $ref: '#/components/parameters/XRecoverySignature'
      operationId: getIdentityDevicesByIdentityIdDevices
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Authorized device credentials at the current head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCatalog'
        '401':
          description: The signature is missing, invalid or stale, the signer does not own the requested identity, the supplied proof is not valid, or the proof was already used (code 401020).
        '409':
          description: The authorization checkpoint is unavailable on this node.
  /identity-devices/{identityId}/transitions:
    get:
      tags:
        - identity-devices
      summary: Read the signed transitions the requesting device or recovery authority may verify
      description: |
        Owner-only. The path identity must equal the signing identity and
        exactly one complete device or recovery proof is required, checked
        before the query is parsed. Unlike the checkpoint read, the device
        credential does not have to be authorized at the head: a removed device
        reads the transitions up to its removal so it can verify that removal
        itself. The recovery authority and a device some replayed state
        authorized take a replay slot, so a replayed read is refused (401020);
        any other key takes none and reads only recoveries and
        concurrentRecoveries.

        Every entry is the stored signed transition, byte-for-byte the
        primitives POST /identity-devices/{identityId}/transitions accepted, never re-signed
        or rewritten and never carrying sealedSecrets. Records the replay
        rejected are never served. The recovery authority reads every list. A
        device authorized in some replayed state reads recoveries,
        concurrentRecoveries and the transitions whose previousRevision is at
        most the revision of the last state that authorizes it. Any other
        device reads recoveries and concurrentRecoveries only.

        No head revision, epoch, network id or authorized-device list is
        returned; clients derive them by replaying what they verify. A client
        deciding whether it was removed fetches without after and wipes only on
        positive signed evidence, never on absence.
      parameters:
        - in: path
          name: identityId
          required: true
          schema:
            type: string
          description: Percent-encoded identity id. It must equal X-Identity-Id.
        - in: query
          name: after
          required: false
          schema:
            type: string
            pattern: '^(0|[1-9][0-9]*)$'
            default: '0'
          description: Keep only entries whose revision is greater than this non-negative safe integer, without leading zeros. It is outside the signed canonical payload and can only narrow the response. Incremental sync only; never the basis of a wipe.
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/XDeviceCredential'
        - $ref: '#/components/parameters/XDeviceSignature'
        - $ref: '#/components/parameters/XRecoverySignature'
      operationId: getIdentityDevicesByIdentityIdTransitions
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: The signed transitions disclosed to the requesting key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationTransitionLog'
        '400':
          description: after is not a non-negative decimal safe integer without leading zeros (code 400050).
        '401':
          description: The signature is missing, invalid or stale, the signer does not own the requested identity, the supplied proof is not exactly one valid device or recovery proof, or the proof was already used (code 401020).
        '409':
          description: The authorization checkpoint is unavailable on this node.
    post:
      tags:
        - identity-devices
      summary: Apply a signed device authorization transition
      description: |
        Applies an enrollment, revocation or recovery transition after checking
        its causal revision, author authority, target proof of possession and
        replay identifiers. The request never contains passwords, protected
        device roots, password KDF metadata or recovery secrets.

        Signatures cover UTF-8 compact JSON with no whitespace. Keys use the
        order shown by the request schema and undefined properties are omitted.
        The target proof envelope is
        {"domain":"pigeon:device-authorization:proof-of-possession:v2",
        "transition":<unsigned transition>}. The author envelope is
        {"domain":"pigeon:device-authorization:transition:v3",
        "proofOfPossession":"<target signature>",
        "transition":<unsigned transition>}. The unsigned transition key order
        is authorCredential, authorizedAt, compromisedCredentials,
        compromisedSince, epoch, identityId, operation, operationId,
        pairingExpiration, pairingId, previousRevision, revision,
        targetCredential, targetCredentialCommitment. Each compromisedCredentials
        entry writes compromisedSince before credential.

        A device retiring itself (revocation with authorCredential equal to
        targetCredential, without compromisedSince or compromisedCredentials)
        may add sealedSecrets to hand over the next sealed secret generation to
        the remaining devices. The node takes the transition revision as
        authorizationRevision and authorCredential as publisherCredential for
        the entry signature preimage, and validates the hand-over before the
        transition is applied. The body limit is 1 MB.

        The path identity must equal the transition's identityId; a mismatch
        is refused (400090) before the transition is read further.
      parameters:
        - in: path
          name: identityId
          required: true
          schema:
            type: string
          description: Percent-encoded identity id of the transition. It must equal the body identityId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationTransition'
      operationId: postIdentityDevicesByIdentityIdTransitions
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Current deterministic authorization checkpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationTransitionResult'
        '400':
          description: Malformed transition, or sealedSecrets on a transition that does not retire its author (code 400030). A transition signed by the identity whose identity id is not the one canonical encoding of a usable key (code 400080). A path identity id that differs from the body identityId (code 400090).
        '409':
          description: Expired, replayed, causally stale or unauthorized transition, or a hand-over that is not sealed to exactly the remaining devices, not signed by the retiring device, or not newer than the stored generation.
        '429':
          description: Per-identity (20 per minute) or per-node (300 per minute) transition rate limit exceeded (code 429030).
  /identity-devices/{identityId}/sealed-secrets:
    put:
      tags:
        - identity-devices
      summary: Publish a device sealed secrets generation
      description: |
        Publishes one generation of per-device sealed secrets for the identity.
        The publisher is the device named by X-Device-Credential. Authentication
        is device proof only, checked against the current head. The identity
        signature and X-Recovery-Signature are not accepted. X-Timestamp must be
        within 30 seconds of the node clock. The device signature is accepted
        once, keyed by the raw signing key: a replay is refused with 401020.

        Each entry signature covers this preimage, serialized with JSON.stringify
        in exactly this key order:
        {"purpose":"pigeon:device-sealed-secret:v1","identityId":"<identity id>","generation":<generation>,"authorizationRevision":<authorizationRevision>,"publisherCredential":"<device credential>","recipientCredential":"<device credential>","sealedSecret":"<sealedSecret>"}

        Entries must cover exactly the authorized device credentials at the head.
        The node stores sealed payloads without decrypting or inspecting them.
      parameters:
        - in: path
          name: identityId
          required: true
          schema:
            type: string
          description: Percent-encoded identity id.
        - $ref: '#/components/parameters/XTimestamp'
        - in: header
          name: X-Device-Credential
          required: true
          schema:
            type: string
          description: Publishing device credential in normalized public-key form. It must be authorized at the current head.
        - in: header
          name: X-Device-Signature
          required: true
          schema:
            type: string
          description: Device signature over the signed HTTP request content (pigeon:signed-http-request:v1 domain, then the canonical method, path, timestamp and body hash).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSealedSecretPublication'
      operationId: putIdentityDevicesByIdentityIdSealedSecrets
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Generation stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSealedSecretReceipt'
        '400':
          description: Malformed body, a field outside its limits, or duplicate recipient credentials. A path identity id that is not the one canonical encoding of a usable key (code 400080).
        '401':
          description: Timestamp outside the 30 second window, missing or invalid device proof, revoked or unknown credential, replayed request, or X-Recovery-Signature supplied (code 401020).
        '409':
          description: Authorization revision mismatch, recipients mismatch (missing, revoked or unknown credential), invalid entry signature, or generation not greater than the stored generation.
    get:
      tags:
        - identity-devices
      summary: Read the caller's device sealed secret
      description: |
        Returns the caller's own entry of the stored generation. Authentication is
        device proof only, checked against the current head, with the same
        X-Timestamp window and the same one-use device signature as PUT, so a
        replayed read is refused with 401020. A revoked or unknown credential is
        refused.

        The response never includes other devices' entries, the authorized-device
        list, head commitments or decrypted material. A device added after the last
        publish has no entry until the owner republishes. Recipients verify the
        signature against publisherCredential and the PUT preimage themselves.
      parameters:
        - in: path
          name: identityId
          required: true
          schema:
            type: string
          description: Percent-encoded identity id.
        - $ref: '#/components/parameters/XTimestamp'
        - in: header
          name: X-Device-Credential
          required: true
          schema:
            type: string
          description: Caller device credential in normalized public-key form. It must be authorized at the current head.
        - in: header
          name: X-Device-Signature
          required: true
          schema:
            type: string
          description: Device signature over the signed HTTP request content (pigeon:signed-http-request:v1 domain, then the canonical method, path, timestamp and body hash).
      operationId: getIdentityDevicesByIdentityIdSealedSecrets
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: The caller's entry of the stored generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSealedSecretRecord'
        '400':
          description: A path identity id that is not the one canonical encoding of a usable key (code 400080).
        '401':
          description: Timestamp outside the 30 second window, missing or invalid device proof, revoked or unknown credential, replayed request, or X-Recovery-Signature supplied (code 401020).
        '404':
          description: No stored bundle for the identity, or no entry for the caller.
components:
  parameters:
    XIdentityId:
      in: header
      name: X-Identity-Id
      required: true
      schema:
        type: string
    XTimestamp:
      in: header
      name: X-Timestamp
      required: true
      schema:
        type: string
    XSignature:
      in: header
      name: X-Signature
      required: true
      schema:
        type: string
    XDeviceCredential:
      in: header
      name: X-Device-Credential
      required: false
      schema:
        type: string
      description: Current authorized device credential in normalized public-key form. It must be supplied together with X-Device-Signature.
    XDeviceSignature:
      in: header
      name: X-Device-Signature
      required: false
      schema:
        type: string
      description: Device signature over the same canonical request payload as X-Signature. It must be supplied together with X-Device-Credential. Each signature is accepted once.
    XRecoverySignature:
      in: header
      name: X-Recovery-Signature
      required: false
      schema:
        type: string
      description: Recovery-authority signature over the same canonical request payload as X-Signature. It is accepted only when both device-proof headers are absent. Each signature is accepted once.
  schemas:
    DeviceAuthorizationTransition:
      type: object
      additionalProperties: false
      required:
        - epoch
        - identityId
        - operation
        - operationId
        - previousRevision
        - revision
        - signature
        - targetCredential
        - targetCredentialCommitment
      properties:
        authorCredential:
          type: string
          description: Public credential of the currently authorized device.
        authorizedAt:
          type: integer
          format: int64
          description: Time accepted by both device signatures; required for enrollment and no later than pairingExpiration.
        compromisedCredentials:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/DeviceCompromisedCredential'
          description: Recovery only. Compromise caps carried across the checkpoint, exactly the caps in effect on the head the recovery follows, strictly ascending by credential, each compromisedSince no greater than previousRevision. Covered by the target proof and the recovery authority signature. Omit when no cap is in effect; an empty array is refused.
        compromisedSince:
          type: integer
          minimum: 0
          description: Revocation only, and no greater than previousRevision. Revokes the target as compromised, not retired - records the target signs while claiming this revision or any later one are refused, even inside the interval where it was authorized. Omit to retire the device normally. Covered by the author signature.
        epoch:
          type: string
          description: Signed recovery epoch. Use genesis before the first recovery and the recovery operation ID afterwards.
        identityId:
          type: string
        operation:
          type: string
          enum: [enroll, revoke, recover]
        operationId:
          type: string
          format: uuid
        pairingExpiration:
          type: integer
          format: int64
          description: Enrollment authorization deadline covered by both device signatures. A completely signed transition remains replayable across offline replicas.
        pairingId:
          type: string
          format: uuid
        previousRevision:
          type: integer
          minimum: 0
        proofOfPossession:
          type: string
          description: Signature made by the target device credential before the author signs the enrollment.
        revision:
          type: integer
          minimum: 1
        sealedSecrets:
          $ref: '#/components/schemas/DeviceSealedSecretHandover'
        signature:
          type: string
          description: Signature made by an authorized device or the recovery authority over the transition and target proof of possession.
        targetCredential:
          type: string
        targetCredentialCommitment:
          type: string
          pattern: '^[a-f0-9]{64}$'
    DeviceCatalog:
      type: object
      required:
        - credentials
        - epoch
        - identityId
        - revision
      properties:
        credentials:
          type: array
          items:
            type: string
        epoch:
          type: string
        identityId:
          type: string
        revision:
          type: integer
          minimum: 0
    DeviceAuthorizationTransitionLog:
      type: object
      additionalProperties: false
      required:
        - concurrentRecoveries
        - identityId
        - recoveries
        - transitions
      properties:
        concurrentRecoveries:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAuthorizationTransition'
          description: Recoveries that lost the checkpoint, at its revision or an earlier one, and still carry a cap it lacks, with the lost recoveries they recovered from. Their carried caps still hold; they never count as removal evidence.
        identityId:
          type: string
        recoveries:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAuthorizationTransition'
          description: Recovery lineage of the replay base, oldest first. Empty before the first recovery.
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAuthorizationTransition'
          description: Transitions the replay accepted from that base, revision groups ascending, each group in the shared tie-break order.
    DeviceCompromisedCredential:
      type: object
      additionalProperties: false
      required:
        - compromisedSince
        - credential
      properties:
        compromisedSince:
          type: integer
          minimum: 0
        credential:
          type: string
    DeviceAuthorization:
      type: object
      required:
        - compromisedCredentials
        - epoch
        - identityId
        - revision
      properties:
        compromisedCredentials:
          type: array
          description: Compromise caps in effect at this checkpoint, sorted ascending by credential. Empty when no device is capped.
          items:
            $ref: '#/components/schemas/DeviceCompromisedCredential'
        epoch:
          type: string
        identityId:
          type: string
        revision:
          type: integer
          minimum: 0
    DeviceAuthorizationTransitionResult:
      allOf:
        - $ref: '#/components/schemas/DeviceAuthorization'
        - type: object
          properties:
            sealedSecrets:
              type: object
              description: Present only when the handed-over generation was stored. Absent when a concurrent transition or publish won the race; the retirement is applied either way.
              required:
                - authorizationRevision
                - generation
              properties:
                authorizationRevision:
                  type: integer
                  minimum: 1
                generation:
                  type: integer
                  minimum: 1
    DeviceSealedSecretHandover:
      type: object
      additionalProperties: false
      description: Self-retirement only. The next sealed secret generation for the devices that remain after the retirement.
      required:
        - generation
        - entries
      properties:
        generation:
          type: integer
          minimum: 1
          description: Must be strictly greater than the stored generation.
        entries:
          type: array
          minItems: 1
          maxItems: 128
          description: Exactly one entry per credential that remains authorized after the retirement, each signed by the retiring device.
          items:
            $ref: '#/components/schemas/DeviceSealedSecretEntry'
    DeviceSealedSecretPublication:
      type: object
      required:
        - generation
        - authorizationRevision
        - entries
      properties:
        generation:
          type: integer
          minimum: 1
        authorizationRevision:
          type: integer
          minimum: 0
          description: Head revision the publisher observed. Must equal the current head.
        entries:
          type: array
          minItems: 1
          maxItems: 128
          description: Exactly one entry per authorized device credential at the head.
          items:
            $ref: '#/components/schemas/DeviceSealedSecretEntry'
    DeviceSealedSecretEntry:
      type: object
      required:
        - recipientCredential
        - sealedSecret
        - signature
      properties:
        recipientCredential:
          type: string
          description: Authorized device credential the entry is sealed to.
        sealedSecret:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[A-Za-z0-9+/=.-]+$'
          description: Opaque sealed payload in the form v2.x25519-hkdf-sha256-aes-256-gcm.<eph>.<iv>.<ct>.<tag>.
        signature:
          type: string
          minLength: 1
          description: Base64 publisher signature over the entry preimage.
    DeviceSealedSecretReceipt:
      type: object
      required:
        - identityId
        - generation
        - authorizationRevision
      properties:
        identityId:
          type: string
        generation:
          type: integer
          minimum: 1
        authorizationRevision:
          type: integer
          minimum: 0
    DeviceSealedSecretRecord:
      type: object
      required:
        - identityId
        - generation
        - authorizationRevision
        - publisherCredential
        - recipientCredential
        - sealedSecret
        - signature
      properties:
        identityId:
          type: string
        generation:
          type: integer
          minimum: 1
        authorizationRevision:
          type: integer
          minimum: 0
        publisherCredential:
          type: string
          description: Device that published the generation. Verify the entry signature against it.
        recipientCredential:
          type: string
          description: The caller's own device credential.
        sealedSecret:
          type: string
        signature:
          type: string
