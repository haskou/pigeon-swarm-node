openapi: 3.0.3
info:
  title: Pigeon-swarm Presence API
  version: 1.0.0
  description: Runtime identity presence state replicated through domain events.
tags:
  - name: presence
paths:
  /presence:
    get:
      tags:
        - presence
      summary: List identity presence states
      description: |
        Returns presence for the requested identity ids. Identities the
        authenticated viewer does not share a one-to-one conversation or
        community with read as `disconnected` without heartbeat timing; sharing
        a group conversation does not count. Invisible identities are
        exposed as `disconnected` unless the authenticated viewer is asking for
        their own identity. Presence state is kept in memory and replicated
        through domain events; it is not persisted in OrbitDB/IPFS.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - in: query
          name: identityIds
          required: true
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          style: form
          explode: true
          description: Comma-separated identity ids or repeated identityIds query params. Identity ids are public keys without PEM wrapping.
      operationId: getPresence
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Presence states.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityPresenceResource'
  /presence/{identityId}:
    get:
      tags:
        - presence
      summary: Read one identity presence state
      description: |
        Returns the identity presence. Viewers who do not share a one-to-one
        conversation or community with the identity receive `disconnected`
        without heartbeat timing; sharing a group conversation does not count.
      parameters:
        - in: path
          name: identityId
          required: true
          schema:
            type: string
          description: URL-encoded identity id/public key without PEM wrapping.
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      operationId: getPresenceByIdentityId
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Presence state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityPresenceResource'
  /presence/me:
    put:
      tags:
        - presence
      summary: Update authenticated identity presence preferences
      description: |
        Sets the authenticated identity selected status. Presence carries no
        custom message; unknown body fields are rejected. `disconnected`
        cannot be selected; it is derived by heartbeat timeout.
        `available`/`away` are normal online states, while `busy`, `custom`
        and `invisible` override automatic away/available derivation.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutPresenceBody'
      operationId: putPresenceMe
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Presence updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityPresenceResource'
        '400':
          description: Invalid status or unknown body field.
components:
  parameters:
    XIdentityId:
      in: header
      name: X-Identity-Id
      required: true
      schema:
        type: string
    XTimestamp:
      in: header
      name: X-Timestamp
      required: true
      schema:
        type: string
    XSignature:
      in: header
      name: X-Signature
      required: true
      schema:
        type: string
  schemas:
    IdentityPresenceResource:
      type: object
      required:
        - identityId
        - status
        - updatedAt
      properties:
        identityId:
          type: string
        status:
          type: string
          enum:
            - available
            - away
            - busy
            - custom
            - disconnected
            - invisible
        lastHeartbeatAt:
          type: integer
        lastActivityAt:
          type: integer
        updatedAt:
          type: integer
    PutPresenceBody:
      type: object
      properties:
        status:
          type: string
          enum:
            - available
            - away
            - busy
            - custom
            - invisible
      additionalProperties: false
