openapi: 3.0.3
info:
  title: Pigeon-swarm Keychains API
  version: 1.0.0
  description: Endpoints for publishing encrypted keychain versions.
tags:
  - name: keychains
paths:
  /keychains:
    post:
      tags:
        - keychains
      summary: Publish encrypted keychain version
      parameters:
        - in: header
          name: X-Identity-Id
          required: true
          schema:
            type: string
        - in: header
          name: X-Timestamp
          required: true
          schema:
            type: string
        - in: header
          name: X-Signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostKeychainBody'
      operationId: postKeychains
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Keychain published successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeychainPublicationResource'
        '401':
          description: Missing or invalid signed request headers.
        '409':
          description: Invalid keychain candidate (code InvalidKeychainCandidateError), the owner identity has no networks (code KeychainOwnerNetworksNotFoundError), or the owner already has a keychain and the candidate is a first version without a previous link (code KeychainOwnerAlreadyHasKeychainError). Publish the next version from the current head instead.
        '503':
          description: Node not ready (code 503020). The node has not finished opening its replicated state yet. Retry. For a first-version publish, the same code means the owner's keychain could not be verified, because a routing record could not be fetched, the routing lookup or a local keychain index read failed, or more routing records exist than the owner check examines and none of the examined ones proves the owner's keychain. Retry later; the publish is safe to repeat.
  /keychains/{identityId}:
    get:
      tags:
        - keychains
      summary: Get current encrypted keychain for identity
      parameters:
        - in: path
          name: identityId
          required: true
          description: Percent-encoded identity id. Clients must use encodeURIComponent(identityId) because identity ids can contain path separators and reserved URL characters.
          schema:
            type: string
          example: MCowBQYDK2VwAyEANHSu7gNCaXDe%2Bhzph8c3HomozCnC%2FLdXe13%2FWpeIaVM%3D
        - in: header
          name: X-Identity-Id
          required: true
          schema:
            type: string
        - in: header
          name: X-Timestamp
          required: true
          schema:
            type: string
        - in: header
          name: X-Signature
          required: true
          schema:
            type: string
      operationId: getKeychainsByIdentityId
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Current encrypted keychain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeychainResource'
        '401':
          description: Missing or invalid signed request (401021 or 401020), or X-Identity-Id differs from identityId.
        '409':
          description: No valid keychain candidate for this identity (code KeychainNotFoundError).
        '503':
          description: Node not ready (code 503020). The node has not finished startup or has not opened its replicated state yet, for example right after it restarted while it replays. The keychain is not reported missing. Retry.
components:
  schemas:
    PostKeychainBody:
      type: object
      required:
        - encryptedPayload
        - signature
        - timestamp
        - version
      properties:
        encryptedPayload:
          type: string
          example: encrypted-keychain-payload
        previousKeychainExternalIdentifier:
          type: string
          nullable: true
          example: bagaaieras...
        signature:
          type: string
          example: lWbIzBOHn7vYKk3WOB9JMvOq9XeXRRy8qvqh8DRPrvUL839Y6DEFGDgPTTMngt+pBugsWSK6LoTKKULTy8joBw==
        timestamp:
          type: integer
          example: 1773848829055
        version:
          type: integer
          minimum: 1
          example: 1
    KeychainPublicationResource:
      type: object
      required:
        - keychainExternalIdentifier
        - ownerIdentityId
        - version
      properties:
        keychainExternalIdentifier:
          type: string
          example: bagaaieras...
        ownerIdentityId:
          type: string
          example: MCowBQYDK2VwAyEANHSu7gNCaXDe+hzph8c3HomozCnC/LdXe13/WpeIaVM=
        version:
          type: integer
          example: 1
    KeychainResource:
      type: object
      required:
        - encryptedPayload
        - keychainExternalIdentifier
        - ownerIdentityId
        - signature
        - timestamp
        - version
      properties:
        encryptedPayload:
          type: string
        keychainExternalIdentifier:
          type: string
        ownerIdentityId:
          type: string
        previousKeychainExternalIdentifier:
          type: string
          nullable: true
        signature:
          type: string
        timestamp:
          type: number
        version:
          type: integer
