openapi: 3.0.3
info:
  title: Pigeon-swarm Identities API
  version: 1.0.0
  description: Endpoints for publishing, updating and resolving signed identities.
tags:
  - name: identities
paths:
  /identities/:
    post:
      tags:
        - identities
      summary: Publish signed identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostIdentityBody'
      responses:
        '200':
          description: Identity published successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResource'
        '400':
          description: Invalid body, or an admissionNonce below the difficulty this node asks while a network is busy (admissions this node accepted plus fresh ones replicated from other nodes), or 20 bits when the identity timestamp is more than 10 minutes from the node clock. A short proof gets `requiredDifficultyBits`; mine again at that difficulty and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientAdmissionProofResource'
        '429':
          description: Identity publication rate limit exceeded (code 429040, IDENTITIES_PUBLISH_RATE_LIMIT_PER_MINUTE publications per identity per minute). Identity admission network quota exceeded (code 429041, IDENTITIES_NETWORK_ADMISSION_RATE_LIMIT_PER_MINUTE, off by default). Identity admission rate limit per client address exceeded (code 429042, IDENTITIES_SOURCE_ADMISSION_RATE_LIMIT_PER_MINUTE, default 30).
  /identities/{reference}:
    get:
      tags:
        - identities
      summary: Get latest known identity (a handle resolves only to its owner, the earliest signed claim)
      parameters:
        - in: path
          name: reference
          required: true
          description: Percent-encoded identity id or profile handle. Clients must use encodeURIComponent(identityId) for identity ids because they can contain path separators and reserved URL characters. Handles may be passed with or without @.
          schema:
            type: string
          example: MCowBQYDK2VwAyEANHSu7gNCaXDe%2Bhzph8c3HomozCnC%2FLdXe13%2FWpeIaVM%3D
      responses:
        '200':
          description: Latest valid identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResource'
    put:
      tags:
        - identities
      summary: Publish signed identity update
      parameters:
        - in: path
          name: reference
          required: true
          description: Percent-encoded identity id.
          schema:
            type: string
        - in: header
          name: X-Identity-Id
          required: true
          schema:
            type: string
        - in: header
          name: X-Timestamp
          required: true
          schema:
            type: string
        - in: header
          name: X-Signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedIdentityBody'
      responses:
        '200':
          description: Identity updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResource'
        '400':
          description: Invalid body, or an admissionNonce below the difficulty this node asks for networks the update adds while they are busy (admissions this node accepted plus fresh ones replicated from other nodes), or 20 bits for added networks when the identity timestamp is more than 10 minutes from the node clock. A short proof gets `requiredDifficultyBits`. Updates that keep their networks are never asked for more.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientAdmissionProofResource'
        '429':
          description: Identity publication rate limit exceeded (code 429040). Identity admission network quota exceeded (code 429041, off by default). Identity admission rate limit per client address exceeded (code 429042).
components:
  schemas:
    PostIdentityBody:
      $ref: '#/components/schemas/SignedIdentityBody'
    InsufficientAdmissionProofResource:
      type: object
      required:
        - code
        - errors
        - httpStatus
        - message
        - requiredDifficultyBits
      properties:
        code:
          type: string
          example: BadRequestError
        errors:
          type: array
          items: {}
        httpStatus:
          type: integer
          example: 400
        message:
          type: string
        requiredDifficultyBits:
          type: integer
          minimum: 16
          maximum: 20
          description: Leading zero bits the admissionNonce must have for this node to accept the publication now.
    SignedIdentityBody:
      type: object
      additionalProperties: false
      required:
        - id
        - admissionNonce
        - authorizationRevision
        - deviceCredential
        - deviceCredentialCommitment
        - recoveryAuthority
        - networks
        - profile
        - timestamp
        - signature
        - version
      properties:
        id:
          type: string
        admissionNonce:
          type: string
          minLength: 1
          maxLength: 64
          description: Proof-of-work nonce bound to the identity id and its sorted network ids. SHA-256 of `pigeon-identity-admission:v1:<id>:<networks>:<nonce>` must have 16 leading zero bits (a fixed protocol constant). Through this API, a node may ask up to 20 bits for networks that already took 60 or more admissions on it in the current minute (one more bit per doubling); see the 400 response. Covered by the identity signature.
        authorizationRevision:
          type: integer
          minimum: 0
          description: Authorization checkpoint revision covered by the identity signature.
        deviceCredential:
          type: string
          description: Independent public signing credential of the genesis device.
        deviceCredentialCommitment:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 commitment to the canonical genesis device signing credential.
        mailboxHome:
          type: string
          pattern: '^https?://[^/?#@\s]+(/[^/?#@\s]+)*$'
          maxLength: 255
          description: Optional canonical base URL of the node hosting this identity's mailboxes, in the form scheme://host[:port][/path-prefix], with no trailing slash, query, fragment or credentials. Covered by the identity signature; omit when no mailbox home is advertised.
        recoveryAuthority:
          type: string
          description: Public recovery authority key in canonical PEM form. No recovery secret is published.
        networks:
          type: array
          description: Identity networks. Signed updates may add networks but cannot remove existing ones.
          items:
            type: string
            format: uuid
        profile:
          type: object
          additionalProperties: false
          required:
            - name
          properties:
            name:
              type: string
            handle:
              type: string
              description: Normalized lowercase handle without @ or spaces. Allowed characters are letters, numbers, dots, hyphens and underscores.
              pattern: '^[A-Za-z0-9._-]{3,32}$'
            biography:
              type: string
              nullable: true
            picture:
              type: string
              nullable: true
              description: Public IPFS content CID for the profile image/avatar returned by POST /ipfs/public.
              example: bafybeigdyrztomockimagecid
            banner:
              type: string
              nullable: true
              description: Public IPFS content CID for the profile banner returned by POST /ipfs/public.
              example: bafybeigdyrztomockbannercid
        timestamp:
          type: number
        signature:
          type: string
        version:
          type: integer
        previousIdentityExternalIdentifier:
          type: string
          nullable: true
    IdentityResource:
      type: object
      required:
        - id
        - authorizationRevision
        - deviceCredential
        - deviceCredentialCommitment
        - recoveryAuthority
        - profile
        - networks
        - timestamp
        - signature
        - version
      properties:
        id:
          type: string
          example: MCowBQYDK2VwAyEANHSu7gNCaXDe+hzph8c3HomozCnC/LdXe13/WpeIaVM=
        admissionNonce:
          type: string
          description: Proof-of-work nonce covered by the identity signature.
        authorizationRevision:
          type: integer
          minimum: 0
          example: 0
        deviceCredential:
          type: string
          description: Independent public signing credential of the genesis device.
        deviceCredentialCommitment:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: 97f378b2eceeac872a5deeafeaf28e4ca6af31e98aa9302651df30386de067c8
        mailboxHome:
          type: string
          example: https://node.example
        recoveryAuthority:
          type: string
          description: Public recovery authority key in canonical PEM form. No recovery secret is published.
          example: -----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEANHSu7gNCaXDe+hzph8c3HomozCnC/LdXe13/WpeIaVM=\n-----END PUBLIC KEY-----\n
        networks:
          type: array
          items:
            type: string
            format: uuid
        profile:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              example: Alice
            handle:
              type: string
              nullable: true
              description: Lowercase profile handle without @ or spaces.
              pattern: '^[A-Za-z0-9._-]{3,32}$'
              example: alice
            biography:
              type: string
              example: I'm just a regular user of the Pigeon-swarm app!
              nullable: true
            picture:
              type: string
              nullable: true
              description: Public IPFS content CID for the profile image/avatar returned by POST /ipfs/public.
              example: bafybeigdyrztomockimagecid
            banner:
              type: string
              nullable: true
              description: Public IPFS content CID for the profile banner returned by POST /ipfs/public.
              example: bafybeigdyrztomockbannercid
        timestamp:
          type: number
        signature:
          type: string
          example: lWbIzBOHn7vYKk3WOB9JMvOq9XeXRRy8qvqh8DRPrvUL839Y6DEFGDgPTTMngt+pBugsWSK6LoTKKULTy8joBw==
        version:
          type: integer
          example: 1
        identityExternalIdentifier:
          type: string
          nullable: true
          example: bafybeigdyrztomockidentitycid
          description: Current published identity CID. Use it as previousIdentityExternalIdentifier in the next signed identity update.
        previousIdentityExternalIdentifier:
          type: string
          nullable: true
