openapi: 3.0.3
info:
  title: Private authorization API
  version: 1.0.0
paths:
  /private-authorization/scopes:
    post:
      tags: [private-authorization]
      summary: Provision a private authorization scope
      description: Verifies that the declared owner device credential is authorized for the signed HTTP identity at the exact supplied revision, verifies the device-signed genesis and protected MLS state, validates the owner-only private community projection, and commits all initial local state atomically.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostPrivateAuthorizationScopeBody'
      responses:
        '201':
          description: Scope provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAuthorizationProvisionResource'
        '200':
          description: Exact genesis already provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAuthorizationProvisionResource'
        '409':
          description: Invalid or conflicting private authorization genesis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAuthorizationError'
        '401':
          description: Invalid signed request
  /private-authorization/challenges:
    post:
      tags: [private-authorization]
      summary: Issue a one-use freshness challenge for a verified operation
      description: The returned canonical JSON must be signed exactly as supplied and used once within ten seconds. Control operations require the same participant-encrypted control frame submitted with the operation so the transition is authenticated before its child head is durably reserved.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostPrivateAuthorizationChallengeBody'
      responses:
        '200':
          description: Exact canonical challenge request to sign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAuthorizationChallengeResource'
        '409':
          description: Invalid private authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAuthorizationError'
        '401':
          description: Invalid signed request
  /private-authorization/operations:
    post:
      tags: [private-authorization]
      summary: Accept a signed private control operation
      description: A control frame is required for membership commits and device revocations. Its byte fields use canonical unpadded base64url.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostPrivateAuthorizationOperationBody'
      responses:
        '200':
          description: Operation accepted or already committed
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [accepted, duplicate]
        '202':
          description: Valid operation retained pending causal dependencies
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [pending]
        '409':
          description: Invalid private authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAuthorizationError'
        '401':
          description: Invalid signed request
components:
  parameters:
    XIdentityId:
      in: header
      name: X-Identity-Id
      required: true
      schema:
        type: string
    XTimestamp:
      in: header
      name: X-Timestamp
      required: true
      schema:
        type: string
    XSignature:
      in: header
      name: X-Signature
      required: true
      schema:
        type: string
  schemas:
    PostPrivateAuthorizationScopeBody:
      type: object
      required: [identityAuthorizationRevision, ownerDeviceKey, projection, protectedMlsState, signedGenesisJson]
      properties:
        identityAuthorizationRevision:
          type: integer
          minimum: 0
        ownerDeviceKey:
          type: string
        projection:
          type: object
          additionalProperties: true
        protectedMlsState:
          type: string
          maxLength: 1398102
        signedGenesisJson:
          type: string
          maxLength: 262144
    PrivateAuthorizationProvisionResource:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, duplicate]
    PostPrivateAuthorizationChallengeBody:
      type: object
      required: [signedOperationJson]
      properties:
        controlFrame:
          $ref: '#/components/schemas/PrivateControlFrameBody'
        signedOperationJson:
          type: string
          maxLength: 262144
    PrivateControlFrameBody:
      type: object
      required: [encryptedMlsState, mlsMessage, signedTransitionJson]
      properties:
        encryptedMlsState:
          type: string
          maxLength: 1398102
        mlsMessage:
          type: string
          maxLength: 349526
        signedTransitionJson:
          type: string
          maxLength: 262144
    PostPrivateAuthorizationOperationBody:
      type: object
      required: [signedFreshnessProofJson, signedOperationJson]
      properties:
        controlFrame:
          $ref: '#/components/schemas/PrivateControlFrameBody'
        signedFreshnessProofJson:
          type: string
          maxLength: 262144
        signedOperationJson:
          type: string
          maxLength: 262144
    PrivateAuthorizationChallengeResource:
      type: object
      required: [challenge]
      properties:
        challenge:
          type: string
    PrivateAuthorizationError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
