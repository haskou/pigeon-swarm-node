openapi: 3.0.3
info:
  title: Pigeon-swarm Stickers API
  version: 1.0.0
  description: Endpoints for sticker packs and public IPFS sticker metadata.
tags:
  - name: stickers
paths:
  /stickers/packs:
    get:
      tags:
        - stickers
      summary: List sticker packs
      parameters:
        - name: ownerIdentityId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Sticker packs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerPacksResource'
    post:
      tags:
        - stickers
      summary: Create a sticker pack
      security:
        - signedRequest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStickerPackBody'
      responses:
        '200':
          description: Sticker pack created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerPackResource'
        '401':
          description: Invalid signed request.
  /stickers/me:
    get:
      tags:
        - stickers
      summary: Get authenticated sticker library
      description: Returns saved packs, favorite stickers and the last 10 recently used stickers for the authenticated identity.
      security:
        - signedRequest: []
      responses:
        '200':
          description: Authenticated sticker library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerUserLibraryResource'
        '401':
          description: Invalid signed request.
  /stickers/packs/{packId}:
    get:
      tags:
        - stickers
      summary: Get a sticker pack
      parameters:
        - $ref: '#/components/parameters/PackId'
      responses:
        '200':
          description: Sticker pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerPackResource'
        '409':
          description: Sticker pack not found.
    patch:
      tags:
        - stickers
      summary: Update a sticker pack profile
      security:
        - signedRequest: []
      parameters:
        - $ref: '#/components/parameters/PackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStickerPackBody'
      responses:
        '200':
          description: Sticker pack updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerPackResource'
        '401':
          description: Invalid signed request.
        '409':
          description: Sticker pack not found or actor is not the owner.
  /stickers/packs/{packId}/stickers:
    post:
      tags:
        - stickers
      summary: Add a sticker to a pack
      description: Sticker assets must already be uploaded as public IPFS bytes with POST /ipfs/public. This endpoint stores metadata and validates size and dimensions.
      security:
        - signedRequest: []
      parameters:
        - $ref: '#/components/parameters/PackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddStickerBody'
      responses:
        '200':
          description: Sticker added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerPackResource'
        '401':
          description: Invalid signed request.
        '409':
          description: Domain validation failed.
  /stickers/packs/{packId}/stickers/{stickerId}:
    patch:
      tags:
        - stickers
      summary: Update a sticker
      security:
        - signedRequest: []
      parameters:
        - $ref: '#/components/parameters/PackId'
        - $ref: '#/components/parameters/StickerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StickerBody'
      responses:
        '200':
          description: Sticker updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerPackResource'
        '401':
          description: Invalid signed request.
        '409':
          description: Domain validation failed.
    delete:
      tags:
        - stickers
      summary: Remove a sticker from a pack
      security:
        - signedRequest: []
      parameters:
        - $ref: '#/components/parameters/PackId'
        - $ref: '#/components/parameters/StickerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteStickerBody'
      responses:
        '200':
          description: Sticker removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerPackResource'
        '401':
          description: Invalid signed request.
        '409':
          description: Sticker pack not found, sticker not found or actor is not the owner.
  /stickers/packs/{packId}/saved:
    put:
      tags:
        - stickers
      summary: Save a sticker pack for the authenticated identity
      security:
        - signedRequest: []
      parameters:
        - $ref: '#/components/parameters/PackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSavedStickerPackBody'
      responses:
        '200':
          description: Sticker library updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerUserLibraryResource'
    delete:
      tags:
        - stickers
      summary: Remove a saved sticker pack from the authenticated identity
      security:
        - signedRequest: []
      parameters:
        - $ref: '#/components/parameters/PackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedMutationBody'
      responses:
        '200':
          description: Sticker library updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerUserLibraryResource'
  /stickers/packs/{packId}/stickers/{stickerId}/favorite:
    put:
      tags:
        - stickers
      summary: Mark a sticker as favorite
      security:
        - signedRequest: []
      parameters:
        - $ref: '#/components/parameters/PackId'
        - $ref: '#/components/parameters/StickerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutFavoriteStickerBody'
      responses:
        '200':
          description: Sticker library updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerUserLibraryResource'
    delete:
      tags:
        - stickers
      summary: Remove a sticker from favorites
      security:
        - signedRequest: []
      parameters:
        - $ref: '#/components/parameters/PackId'
        - $ref: '#/components/parameters/StickerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedMutationBody'
      responses:
        '200':
          description: Sticker library updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerUserLibraryResource'
  /stickers/packs/{packId}/stickers/{stickerId}/used:
    post:
      tags:
        - stickers
      summary: Record a sticker usage in the authenticated recent stickers
      description: Backend cannot infer this from encrypted messages, so frontend calls this after a sticker message is sent successfully.
      security:
        - signedRequest: []
      parameters:
        - $ref: '#/components/parameters/PackId'
        - $ref: '#/components/parameters/StickerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUsedStickerBody'
      responses:
        '200':
          description: Sticker library updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerUserLibraryResource'
components:
  securitySchemes:
    signedRequest:
      type: apiKey
      in: header
      name: X-Signature
  parameters:
    PackId:
      name: packId
      in: path
      required: true
      schema:
        type: string
    StickerId:
      name: stickerId
      in: path
      required: true
      schema:
        type: string
  schemas:
    CreateStickerPackBody:
      type: object
      description: The client chooses the pack id and the creation time and signs both records. mutation is a put proof (store stickerPacks, recordId packId) over the whole pack document {id, name, ownerIdentityId, createdAt, updatedAt = createdAt, stickers [], scopeType sticker_pack}; savedPackMutation is a put proof (store stickerUserLibraries, recordId saved:<identityId>:<packId>) over {id, identityId, packId, savedAt = createdAt, scopeType sticker_saved_pack}.
      required:
        - packId
        - name
        - createdAt
        - mutation
        - savedPackMutation
      properties:
        packId:
          type: string
        name:
          type: string
          maxLength: 80
          example: Blue archive reactions
        createdAt:
          type: integer
          minimum: 0
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
        savedPackMutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    UpdateStickerPackBody:
      type: object
      description: mutation is a put proof over the whole resulting pack document (store stickerPacks, recordId packId) with updatedAt as sent.
      required:
        - name
        - updatedAt
        - mutation
      properties:
        name:
          type: string
          maxLength: 80
        updatedAt:
          type: integer
          minimum: 0
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    StickerDetails:
      type: object
      required:
        - type
        - assetCid
        - contentType
        - sizeBytes
        - dimensions
      properties:
        type:
          type: string
          enum:
            - static
            - animated
            - video
        assetCid:
          type: string
          description: CID returned by POST /ipfs/public.
          example: bafkreibm6jg3ux5qumhcn2b3flc3tyu6dmlb4xa7u5bf44yegnrjhc4yeq
        contentType:
          type: string
          example: image/png
        sizeBytes:
          type: integer
          description: Static max 512 KiB, animated max 64 KiB, video max 256 KiB.
          example: 215040
        dimensions:
          type: object
          required:
            - width
            - height
          properties:
            width:
              type: integer
              maximum: 512
              example: 512
            height:
              type: integer
              maximum: 512
              example: 512
    StickerBody:
      description: Sticker details plus the signed whole-pack mutation the change produces (put proof, store stickerPacks, recordId packId).
      allOf:
        - $ref: '#/components/schemas/StickerDetails'
        - type: object
          required:
            - updatedAt
            - mutation
          properties:
            updatedAt:
              type: integer
              minimum: 0
            mutation:
              $ref: '#/components/schemas/SignedPublicMutation'
    AddStickerBody:
      allOf:
        - $ref: '#/components/schemas/StickerBody'
        - type: object
          required:
            - stickerId
          properties:
            stickerId:
              type: string
              description: Client-chosen id of the new sticker.
    DeleteStickerBody:
      type: object
      required:
        - updatedAt
        - mutation
      properties:
        updatedAt:
          type: integer
          minimum: 0
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    SignedMutationBody:
      type: object
      description: A delete proof (store stickerUserLibraries) over the tombstone of the saved pack or favorite record.
      required:
        - mutation
      properties:
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    PutSavedStickerPackBody:
      type: object
      description: mutation is a put proof (store stickerUserLibraries, recordId saved:<identityId>:<packId>) over {id, identityId, packId, savedAt, scopeType sticker_saved_pack}.
      required:
        - savedAt
        - mutation
      properties:
        savedAt:
          type: integer
          minimum: 0
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    PutFavoriteStickerBody:
      type: object
      description: mutation is a put proof (store stickerUserLibraries, recordId favorite:<identityId>:<packId>:<stickerId>) over {id, identityId, packId, stickerId, favoritedAt, scopeType sticker_favorite}.
      required:
        - favoritedAt
        - mutation
      properties:
        favoritedAt:
          type: integer
          minimum: 0
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    PostUsedStickerBody:
      type: object
      description: mutation is a put proof (store stickerUserLibraries, recordId recent:<identityId>:<packId>:<stickerId>) over {id, identityId, packId, stickerId, usedAt, scopeType sticker_recent}.
      required:
        - usedAt
        - mutation
      properties:
        usedAt:
          type: integer
          minimum: 0
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    SignedPublicMutation:
      type: object
      description: Client-signed intent for a replicated public record. The node holds no user private keys, so the UI signs it. payloadDigest commits to the record without its proof; author.deviceCredential must be an authorized device of author.identityId in its device-authorization chain at author.authorizationRevision (not the current head; see docs/design/causal-device-authorization.md). The winner of concurrent mutations is the higher sequence, then the lower digest; no wall clock is used.
      required:
        - version
        - operationId
        - kind
        - store
        - recordId
        - payloadDigest
        - predecessor
        - sequence
        - author
        - signature
      properties:
        version:
          type: integer
          enum: [2]
        operationId:
          type: string
        kind:
          type: string
          enum: [put, delete]
        store:
          type: string
        recordId:
          type: string
        payloadDigest:
          type: string
        predecessor:
          type: string
          nullable: true
          description: Digest of the previous mutation. Null if and only if sequence is 0.
        sequence:
          type: integer
          minimum: 0
        author:
          type: object
          required: [identityId, deviceCredential, authorizationRevision]
          properties:
            identityId:
              type: string
            deviceCredential:
              type: string
            authorizationRevision:
              type: integer
              minimum: 0
              description: Revision of the author's device-authorization chain (GET /identity-devices/authorization) observed when signing. The device is checked against the chain at this revision, not the current head.
        signature:
          type: string
    StickerResource:
      allOf:
        - $ref: '#/components/schemas/StickerDetails'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
    StickerPackResource:
      type: object
      required:
        - id
        - ownerIdentityId
        - name
        - stickers
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        ownerIdentityId:
          type: string
        name:
          type: string
        stickers:
          type: array
          items:
            $ref: '#/components/schemas/StickerResource'
        createdAt:
          type: integer
        updatedAt:
          type: integer
    StickerPacksResource:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/StickerPackResource'
    FavoriteStickerResource:
      type: object
      required:
        - packId
        - stickerId
        - favoritedAt
        - sticker
      properties:
        packId:
          type: string
        stickerId:
          type: string
        favoritedAt:
          type: integer
        sticker:
          $ref: '#/components/schemas/StickerResource'
    RecentStickerResource:
      type: object
      required:
        - packId
        - stickerId
        - usedAt
        - sticker
      properties:
        packId:
          type: string
        stickerId:
          type: string
        usedAt:
          type: integer
        sticker:
          $ref: '#/components/schemas/StickerResource'
    StickerUserLibraryResource:
      type: object
      required:
        - savedPacks
        - favoriteStickers
        - recentStickers
      properties:
        savedPacks:
          type: array
          items:
            $ref: '#/components/schemas/StickerPackResource'
        favoriteStickers:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteStickerResource'
        recentStickers:
          type: array
          items:
            $ref: '#/components/schemas/RecentStickerResource'
