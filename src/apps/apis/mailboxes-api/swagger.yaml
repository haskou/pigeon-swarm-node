openapi: 3.0.3
info:
  title: Pigeon-swarm Mailbox API
  version: 1.0.0
  description: Node-local queues of opaque ciphertext envelopes addressed by an unlinkable mailbox identifier. Requests carry no identity; authorization is a bearer capability only. Mailboxes are never published to OrbitDB, IPFS, the DHT or pubsub.
tags:
  - name: mailboxes
paths:
  /mailboxes/{mailboxId}:
    put:
      tags:
        - mailboxes
      summary: Create a mailbox
      description: Unauthenticated, rate limited per client address by `MAILBOX_CREATE_RATE_LIMIT_PER_MINUTE`. The address is the socket address unless `API_TRUST_PROXY` names a reverse proxy; IPv6 clients share a /64. The recipient supplies the SHA-256 (hex) of the post and read tokens and a `creationNonce` proof of work, which is SHA-256 over the mailbox id, both token hashes and the nonce, and must start with the current difficulty (16 zero bits while the node holds at most half of `MAILBOX_MAX_COUNT`, rising in four steps above half capacity to 20 at the limit). The node never sees the tokens at creation. Idempotent for identical hashes and nonce.
      parameters:
        - $ref: '#/components/parameters/MailboxId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - postTokenHash
                - readTokenHash
                - creationNonce
              properties:
                postTokenHash:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                readTokenHash:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                  description: Becomes the mailbox's first reader. Further readers join through POST /mailboxes/{mailboxId}/readers.
                creationNonce:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{1,64}$'
      responses:
        '200':
          description: Already exists with the same hashes.
        '201':
          description: Created.
        '400':
          description: Invalid hashes, or a creationNonce that fails the proof of work. A short proof includes `requiredDifficultyBits` with the bits it needs.
        '409':
          description: Exists with different hashes.
        '429':
          description: Creation rate limit (code 429041, `MAILBOX_CREATE_RATE_LIMIT_PER_MINUTE` per client address), or `MAILBOX_MAX_COUNT` reached with no idle empty mailbox to evict.
    delete:
      tags:
        - mailboxes
      summary: Delete a mailbox and its envelopes
      security:
        - readCapability: []
      parameters:
        - $ref: '#/components/parameters/MailboxId'
      responses:
        '204':
          description: Deleted.
        '404':
          description: Unknown mailbox or wrong capability.
  /mailboxes/{mailboxId}/envelopes:
    post:
      tags:
        - mailboxes
      summary: Append an envelope
      description: Authorized by the post capability. `body` must decode to exactly 1024, 4096, 16384 or 65536 bytes (clients pad to a bucket). Appending an already stored `envelopeId` returns the first cursor and stores nothing. A full mailbox fails with 409; older envelopes are never dropped. Appends are rate limited per mailbox (`MAILBOX_APPEND_RATE_PER_MINUTE`, 429); a repeated `envelopeId` is not charged.
      security:
        - postCapability: []
      parameters:
        - $ref: '#/components/parameters/MailboxId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - envelopeId
                - body
              properties:
                envelopeId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{22}$'
                  description: 16 random bytes, base64url. Deduplication key.
                body:
                  type: string
                  description: Base64url ciphertext.
      responses:
        '200':
          description: Duplicate envelopeId; the earlier cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cursor'
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cursor'
        '400':
          description: Body is not base64url or not an allowed size.
        '404':
          description: Unknown mailbox or wrong capability.
        '409':
          description: Mailbox reached its envelope or byte limit.
        '429':
          description: Mailbox is receiving envelopes too quickly.
    get:
      tags:
        - mailboxes
      summary: Page pending envelopes
      description: Authorized by the read capability. Returns envelopes with cursor greater than `after`, oldest first. Reading marks the mailbox live for retention. Cursors are unique per mailbox id across its lifetimes. A mailbox recreated after deletion, expiry or eviction issues cursors above every cursor the node has retired, so an `after` kept from an earlier life never hides its envelopes.
      security:
        - readCapability: []
      parameters:
        - $ref: '#/components/parameters/MailboxId'
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: A page of envelopes.
          content:
            application/json:
              schema:
                type: object
                required:
                  - envelopes
                  - hasMore
                properties:
                  hasMore:
                    type: boolean
                  envelopes:
                    type: array
                    items:
                      type: object
                      required:
                        - body
                        - cursor
                        - envelopeId
                      properties:
                        body:
                          type: string
                        cursor:
                          type: integer
                        envelopeId:
                          type: string
        '404':
          description: Unknown mailbox or wrong capability.
  /mailboxes/{mailboxId}/readers:
    get:
      tags:
        - mailboxes
      summary: List the readers of a mailbox
      description: Authorized by a read capability. Returns each reader's hash and acknowledged cursor, never tokens. `maxReaders` is `MAILBOX_MAX_READERS`.
      security:
        - readCapability: []
      parameters:
        - $ref: '#/components/parameters/MailboxId'
      responses:
        '200':
          description: The reader set.
          content:
            application/json:
              schema:
                type: object
                required:
                  - maxReaders
                  - readers
                properties:
                  maxReaders:
                    type: integer
                    description: Most readers the mailbox holds, `MAILBOX_MAX_READERS` (default 129, the root plus 128 devices).
                  readers:
                    type: array
                    items:
                      type: object
                      required:
                        - ackedCursor
                        - readTokenHash
                      properties:
                        ackedCursor:
                          type: integer
                        readTokenHash:
                          type: string
                          pattern: '^[0-9a-f]{64}$'
        '404':
          description: Unknown mailbox or wrong capability.
    post:
      tags:
        - mailboxes
      summary: Add a reader
      description: Authorized by an existing read capability; a post token cannot add a reader. The new reader starts with nothing acknowledged, so it receives the retained backlog.
      security:
        - readCapability: []
      parameters:
        - $ref: '#/components/parameters/MailboxId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - readTokenHash
              properties:
                readTokenHash:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: The hash is already a reader.
        '201':
          description: Reader added.
        '404':
          description: Unknown mailbox, wrong capability, or a post token.
        '409':
          description: The mailbox already has `MAILBOX_MAX_READERS` readers.
  /mailboxes/{mailboxId}/readers/{readTokenHash}:
    delete:
      tags:
        - mailboxes
      summary: Revoke a reader
      description: Authorized by a read capability that is still a reader. Envelopes the revoked reader was holding back are deleted once the remaining readers have acked them. The last reader cannot be revoked. Closes the revoked reader's realtime subscriptions.
      security:
        - readCapability: []
      parameters:
        - $ref: '#/components/parameters/MailboxId'
        - name: readTokenHash
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        '204':
          description: Revoked.
        '404':
          description: Unknown mailbox, wrong capability, or unknown reader.
        '409':
          description: The last reader cannot be revoked.
[/Users/hasko/Projects/.worktrees/pigeon-mailbox-reader-set-289/src/apps/apis/open-api.yaml#0832]
  /mailboxes/{mailboxId}/ack:
    post:
      tags:
        - mailboxes
      summary: Acknowledge envelopes
      description: Authorized by the read capability. Records this reader's cursor. Deletes envelopes up to and including `upTo` once every reader has acked them.
      security:
        - readCapability: []
      parameters:
        - $ref: '#/components/parameters/MailboxId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - upTo
              properties:
                upTo:
                  type: integer
                  minimum: 0
      responses:
        '204':
          description: Acknowledged.
        '404':
          description: Unknown mailbox or wrong capability.
components:
  securitySchemes:
    postCapability:
      type: http
      scheme: bearer
    readCapability:
      type: http
      scheme: bearer
  parameters:
    MailboxId:
      name: mailboxId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      description: 32 bytes, base64url, derived by the endpoints from a shared secret.
  schemas:
    Cursor:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: integer
          description: Unique per mailbox id across its lifetimes. A recreated mailbox issues cursors above every cursor the node has retired.
