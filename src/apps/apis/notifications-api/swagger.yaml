openapi: 3.0.3
info:
  title: Pigeon-swarm Notifications API
  version: 1.0.0
  description: Endpoints for actionable identity notifications.
tags:
  - name: notifications
paths:
  /notifications/:
    get:
      tags:
        - notifications
      summary: List authenticated identity notifications
      description: >-
        Lists the recipient's notifications, newest record id first. Pending
        group conversation invitations (no signed accepted or declined state)
        are taken in ascending record id order and listed at most
        NOTIFICATIONS_MAX_PENDING_GROUP_INVITATIONS_PER_PAIR (default 4) per
        inviter and NOTIFICATIONS_MAX_PENDING_GROUP_INVITATIONS_PER_RECIPIENT
        (default 100) in total; the rest is held back, stays stored and can
        still be updated by id. The caps apply before limit and
        beforeNotificationId; a held-back beforeNotificationId restarts from
        the first page.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: beforeNotificationId
          schema:
            type: string
      responses:
        '200':
          description: Notifications for the authenticated recipient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsResource'
    post:
      tags:
        - notifications
      summary: Create a conversation, group conversation or community invitation notification
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostNotificationBody'
      responses:
        '200':
          description: Notification created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResource'
        '400':
          description: >-
            Invalid body. Code 400070: a group conversation invitation must not
            carry a conversation id.
        '403':
          description: Authenticated identity is not the inviter.
  /notifications/{notificationId}:
    patch:
      tags:
        - notifications
      summary: Update a notification as the recipient
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchNotificationBody'
      responses:
        '200':
          description: Notification updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResource'
        '409':
          description: Authenticated identity is not the notification recipient.
components:
  parameters:
    XIdentityId:
      in: header
      name: X-Identity-Id
      required: true
      schema:
        type: string
    XTimestamp:
      in: header
      name: X-Timestamp
      required: true
      schema:
        type: string
    XSignature:
      in: header
      name: X-Signature
      required: true
      schema:
        type: string
  schemas:
    ConversationInvitationPayload:
      type: object
      required:
        - conversationId
        - inviterIdentityId
        - recipientIdentityId
        - encryptedConversationKey
        - nonce
      properties:
        conversationId:
          type: string
        inviterIdentityId:
          type: string
        recipientIdentityId:
          type: string
        encryptedConversationKey:
          type: string
        nonce:
          type: string
          description: Client-generated base64url nonce (16-128 chars) the invitation id is derived from.
    GroupConversationInvitationPayload:
      type: object
      description: >-
        A group letter names no conversation; the conversation id travels only
        inside the seal, and a letter carrying conversationId is rejected.
      required:
        - inviterIdentityId
        - recipientIdentityId
        - encryptedConversationKey
        - nonce
      not:
        required:
          - conversationId
      properties:
        inviterIdentityId:
          type: string
        recipientIdentityId:
          type: string
        encryptedConversationKey:
          type: string
        nonce:
          type: string
          description: Client-generated base64url nonce (16-128 chars) the invitation id is derived from.
    CommunityInvitationPayload:
      type: object
      required:
        - communityId
        - inviterIdentityId
        - recipientIdentityId
        - nonce
      properties:
        communityId:
          type: string
        inviterIdentityId:
          type: string
        recipientIdentityId:
          type: string
        nonce:
          type: string
          description: Client-generated base64url nonce (16-128 chars) the invitation id is derived from.
    MissedCallPayload:
      type: object
      required:
        - callId
        - callerIdentityId
        - networkId
        - recipientIdentityId
      properties:
        callId:
          type: string
          format: uuid
        callerIdentityId:
          type: string
        networkId:
          type: string
          format: uuid
        recipientIdentityId:
          type: string
    NotificationResource:
      type: object
      required:
        - id
        - type
        - recipientIdentityId
        - status
        - state
        - payload
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - community_invitation
            - conversation_invitation
            - group_conversation_invitation
            - missed_call
        recipientIdentityId:
          type: string
        status:
          type: string
          enum:
            - unread
            - read
        state:
          type: string
          enum:
            - pending
            - accepted
            - declined
        payload:
          oneOf:
            - $ref: '#/components/schemas/CommunityInvitationPayload'
            - $ref: '#/components/schemas/ConversationInvitationPayload'
            - $ref: '#/components/schemas/GroupConversationInvitationPayload'
            - $ref: '#/components/schemas/MissedCallPayload'
    NotificationsResource:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResource'
    PostNotificationBody:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/ConversationInvitationPayload'
            - type: object
              required:
                - type
                - mutation
              properties:
                mutation:
                  type: object
                  description: Inviter-signed PublicMutationProof (store notifications, kind put, scopeType notification_invitation).
                type:
                  type: string
                  enum:
                    - conversation_invitation
        - allOf:
            - $ref: '#/components/schemas/GroupConversationInvitationPayload'
            - type: object
              required:
                - type
                - mutation
              properties:
                mutation:
                  type: object
                  description: Inviter-signed PublicMutationProof (store notifications, kind put, scopeType notification_invitation).
                type:
                  type: string
                  enum:
                    - group_conversation_invitation
        - allOf:
            - $ref: '#/components/schemas/CommunityInvitationPayload'
            - type: object
              required:
                - type
                - mutation
              properties:
                mutation:
                  type: object
                  description: Inviter-signed PublicMutationProof (store notifications, kind put, scopeType notification_invitation).
                type:
                  type: string
                  enum:
                    - community_invitation
    PatchNotificationBody:
      type: object
      required:
        - state
        - mutation
      properties:
        mutation:
          type: object
          description: Recipient-signed PublicMutationProof for the notification-state record.
        state:
          type: string
          enum:
            - accepted
            - declined
