openapi: 3.0.3
info:
  title: Polls API
  version: 1.0.0
tags:
  - name: polls
paths:
  /polls/:
    post:
      tags: [polls]
      summary: Create a poll in a community text channel or group conversation
      security:
        - signedRequest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostPollBody'
      responses:
        '200':
          description: Created poll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
  /polls/{pollId}:
    get:
      tags: [polls]
      summary: Get a poll by id
      security:
        - signedRequest: []
      parameters:
        - $ref: '#/components/parameters/PollId'
      responses:
        '200':
          description: Poll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
  /polls/{pollId}/votes:
    post:
      tags: [polls]
      summary: Cast or replace the authenticated identity vote
      security:
        - signedRequest: []
      parameters:
        - $ref: '#/components/parameters/PollId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostPollVoteBody'
      responses:
        '200':
          description: Updated poll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
  /polls/{pollId}/votes/me:
    delete:
      tags: [polls]
      summary: Remove the authenticated identity vote with a signed tombstone
      security:
        - signedRequest: []
      parameters:
        - $ref: '#/components/parameters/PollId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletePollVoteBody'
      responses:
        '200':
          description: Updated poll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
  /polls/{pollId}/close:
    post:
      tags: [polls]
      summary: Close a poll
      security:
        - signedRequest: []
      parameters:
        - $ref: '#/components/parameters/PollId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostPollCloseBody'
      responses:
        '200':
          description: Closed poll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
components:
  securitySchemes:
    signedRequest:
      type: apiKey
      in: header
      name: X-Signature
  parameters:
    PollId:
      in: path
      name: pollId
      required: true
      schema:
        type: string
  schemas:
    PostPollBody:
      type: object
      required:
        - allowsMultipleVotes
        - createdAt
        - mutation
        - options
        - pollId
        - question
        - scopeType
        - timelineMutation
      properties:
        pollId:
          type: string
          description: Client-chosen poll id; the signed record id.
        createdAt:
          type: integer
          minimum: 0
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
        timelineMutation:
          description: Signed public mutation (store messages) for the poll timeline message. Community scope uses record id community:<communityId>:<channelId>:<pollId>:<creator>; conversation scope uses the pollId.
          $ref: '#/components/schemas/SignedPublicMutation'
        allowsMultipleVotes:
          type: boolean
        channelId:
          type: string
        communityId:
          type: string
        conversationId:
          type: string
        expiresAt:
          type: integer
          nullable: true
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: object
            required: [id, text]
            properties:
              id:
                type: string
              text:
                type: string
        question:
          type: string
          maxLength: 200
        scopeType:
          type: string
          enum: [community_channel, group_conversation]
    PostPollVoteBody:
      type: object
      required:
        - createdAt
        - mutation
        - optionIds
      properties:
        createdAt:
          type: integer
          minimum: 0
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
        optionIds:
          type: array
          minItems: 1
          items:
            type: string
    DeletePollVoteBody:
      type: object
      required: [mutation]
      properties:
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    PostPollCloseBody:
      type: object
      required: [createdAt, mutation]
      properties:
        createdAt:
          type: integer
          minimum: 0
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    SignedPublicMutation:
      type: object
      description: Client-signed intent for a replicated public record. The node holds no user private keys, so the UI signs it. payloadDigest commits to the record without its proof; author.deviceCredential must be an authorized device of author.identityId in its current device authorization head. The winner of concurrent mutations is the higher sequence, then the lower digest; no wall clock is used.
      required:
        - version
        - operationId
        - kind
        - store
        - recordId
        - payloadDigest
        - predecessor
        - sequence
        - author
        - signature
      properties:
        version:
          type: integer
          enum: [1]
        operationId:
          type: string
        kind:
          type: string
          enum: [put, delete]
        store:
          type: string
        recordId:
          type: string
        payloadDigest:
          type: string
        predecessor:
          type: string
          nullable: true
          description: Digest of the previous mutation. Null if and only if sequence is 0.
        sequence:
          type: integer
          minimum: 0
        author:
          type: object
          required: [identityId, deviceCredential]
          properties:
            identityId:
              type: string
            deviceCredential:
              type: string
        signature:
          type: string
    Poll:
      type: object
      required:
        - allowsMultipleVotes
        - createdAt
        - creatorIdentityId
        - id
        - options
        - question
        - scope
        - status
        - type
        - votes
      properties:
        allowsMultipleVotes:
          type: boolean
        createdAt:
          type: integer
        creatorIdentityId:
          type: string
        expiresAt:
          type: integer
          nullable: true
        id:
          type: string
        options:
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id:
                type: string
              text:
                type: string
        question:
          type: string
        scope:
          type: object
          required:
            - type
          properties:
            channelId:
              type: string
            communityId:
              type: string
            conversationId:
              type: string
            type:
              type: string
              enum: [community_channel, group_conversation]
        status:
          type: string
          enum: [open, closed]
        type:
          type: string
          enum: [poll]
        votes:
          type: array
          items:
            type: object
            required: [createdAt, optionIds, voterIdentityId]
            properties:
              createdAt:
                type: integer
              optionIds:
                type: array
                items:
                  type: string
              voterIdentityId:
                type: string
