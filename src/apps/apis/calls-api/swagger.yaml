openapi: 3.0.3
info:
  title: Pigeon-swarm Calls API
  version: 1.0.0
  description: Signalling endpoints for one-to-one, group and community channel calls.
tags:
  - name: calls
paths:
  /calls:
    get:
      tags:
        - calls
      summary: List active calls for the authenticated identity
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque cursor returned as nextCursor. It is not a capability and grants no access; a cursor from another list or a malformed one is refused with 400 (code 400110).
      operationId: getCalls
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Active calls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallsResource'
        '414':
          $ref: '../open-api.yaml#/components/responses/RequestTargetTooLong'
    post:
      tags:
        - calls
      summary: Start a call
      description: |
        The creator signs the start (`call_start` record in the replicated `calls`
        collection); the node never signs for a user. The call id is derived from
        the creator and the client `nonce`: the first 16 bytes of
        sha256(`<creatorIdentityId>:<nonce>`) as a UUID, with record id
        `call:<callId>`. Every node derives the call state from the admitted
        signed records only.

        Conversation calls create a new call with exactly the participants of the
        signed conversation. For a community channel the API returns the active
        call WITHOUT storing a start when the channel already has a live call
        (the client then signs a join with `POST /calls/{callId}/participants`);
        otherwise the signed start (with `sessionEpoch`) is stored. The node
        enforces one live call per channel: concurrent starts resolve to the one
        with the lowest start payload digest on every node. The losing call reads
        as ended with `supersededByCallId` naming the winner.

        A group conversation has no conversation call: its members start a
        `group_capability` call that names nobody. The signed start carries only
        the SHA-256 `capabilityHash` of a capability the members derive from the
        MLS exporter of the group epoch, and the `networkId` the creator belongs
        to. Joining, reading, signalling, heartbeats and leaving present the
        capability as `Authorization: Bearer <capability>`; the roster is the
        lease set, joins and leaves are verified but not stored, leaving never
        ends the call and only the creator ends it. Such calls never ring, push
        or enter call history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCallBody'
      operationId: postCalls
      responses:
        '415':
          description: Request body is not application/json.
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '201':
          description: Call started. `Location` names the new call.
          headers:
            Location:
              description: Relative URL of the new call.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallResource'
        '200':
          description: A live community channel call already exists; it is returned without storing a new start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallResource'
        '400':
          description: The signed start does not match the request, the call id derivation or the signed conversation or community state.
        '429':
          description: Call record rate limit exceeded (code 429021, CALLS_RECORD_RATE_LIMIT_PER_MINUTE records per identity per minute). Only a record about to be stored is charged; requests the call refuses, 503020 answers and a community start that returns the live call cost nothing, while a record the store then rejects (stale or mismatched proof) stays charged.
  /calls/{callId}:
    get:
      tags:
        - calls
      summary: Get a minimal live snapshot by id
      description: Current conversation membership or voice-channel access is checked on every request. Past call participation alone does not grant access. Currently authorized community members may read a live snapshot without joining. Community snapshots omit creator and session timestamps; departed and disconnected participants are omitted.
      parameters:
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallCapability'
      operationId: getCallsByCallId
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Call found for the currently authorized identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallResource'
        '404':
          description: The path segment is not a canonical call id (lowercase UUID), so no call can have it. Refused after authentication and before any lookup.
        '409':
          description: Call not found or not visible to the authenticated identity.
        '503':
          description: Replicated state not ready (code 503020). The node holds the start of the call but has not admitted it yet, or has not replayed the call history yet (at most 60 s), for example right after it restarted. Retry.
    delete:
      tags:
        - calls
      summary: End a call
      description: The ender signs a `call_end` record (`call-end:<callId>`). A conversation call may be ended by any participant; a community or group call only by its creator.
      parameters:
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallCapability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallMutationBody'
      operationId: deleteCallsByCallId
      responses:
        '415':
          description: Request body is not application/json.
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Call ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallResource'
        '429':
          description: Call record rate limit exceeded (code 429021). Only an end about to be stored is charged.
        '503':
          description: Replicated state not ready (code 503020). The node holds the start of the call, or the authenticated identity's own participant record of it, but has not admitted it yet, or has not replayed the call history yet (at most 60 s), for example right after it restarted. Retry.
  /calls/{callId}/participants:
    post:
      tags:
        - calls
      summary: Join an active call
      description: The participant signs a `call_participant` record with state `joined` (`call-participant:<callId>:<identityId>`). Joining the live call of a community channel is how a caller who received the active call from `POST /calls` takes part. A community channel or group call join is verified but not stored; its roster is the lease set. A group call join requires the capability.
      parameters:
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallCapability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallMutationBody'
      operationId: postCallsByCallIdParticipants
      responses:
        '415':
          description: Request body is not application/json.
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Call joined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallResource'
        '429':
          description: Call record rate limit exceeded (code 429021). Only a join about to be stored is charged.
        '503':
          description: Replicated state not ready (code 503020). The node holds the start of the call but has not admitted it yet, or has not replayed the call history yet (at most 60 s), for example right after it restarted. Retry.
  /calls/{callId}/participants/me:
    delete:
      tags:
        - calls
      summary: Leave an active call
      description: The participant signs a `call_participant` record with state `left`, or `declined` while still ringing (the record state follows the participant's current state on the node). Leaving a one-to-one call ends it for everybody. A community channel or group call leave is verified but not stored and never ends the call.
      parameters:
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallCapability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallMutationBody'
      operationId: deleteCallsByCallIdParticipantsMe
      responses:
        '415':
          description: Request body is not application/json.
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Call left.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallResource'
        '429':
          description: Call record rate limit exceeded (code 429021). Only a leave about to be stored is charged.
        '503':
          description: Replicated state not ready (code 503020). The node holds the start of the call but has not admitted it yet, or has not replayed the call history yet (at most 60 s), for example right after it restarted. Retry.
    patch:
      tags:
        - calls
      summary: Refresh the authenticated participant heartbeat
      description: Joined participants renew their lease while media is active. Current scope access is rechecked. Community calls require an unexpired participation grant on this node; explicit leave or lost runtime state requires an explicit join. Returns no roster or diagnostics; runtime heartbeat state is not persisted in OrbitDB.
      parameters:
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallCapability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCallParticipantBody'
      operationId: patchCallsByCallIdParticipantsMe
      responses:
        '415':
          description: Request body is not application/json.
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '204':
          description: Participant heartbeat recorded. No response body.
        '409':
          description: Call is inactive, inaccessible, a media connection targets the sender or a non-participant (for example a participant that just left) or repeats a remote identity, or the community participation grant is missing or expired.
        '503':
          description: Replicated state not ready (code 503020). The node holds the start of the call, or the authenticated identity's own participant record of it, but has not admitted it yet, or has not replayed the call history yet (at most 60 s), for example right after it restarted. Retry; the call is not over.
  /calls/{callId}/signals:
    post:
      tags:
        - calls
      summary: Send WebRTC signalling data to another call participant
      parameters:
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallCapability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCallSignalBody'
      operationId: postCallsByCallIdSignals
      responses:
        '415':
          description: Request body is not application/json.
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Signal accepted for retryable delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallSignalDeliveryResource'
        '429':
          description: Signal rate limit exceeded (code 429010, CALLS_SIGNAL_RATE_LIMIT_PER_MINUTE signals per call and sender per minute).
        '413':
          description: Signal payload exceeds 64 KiB.
        '503':
          description: Replicated state not ready (code 503020). The node holds the start of the call, or the sender's or recipient's own participant record of it, but has not admitted it yet, or has not replayed the call history yet (at most 60 s), for example right after it restarted. Retry.
  /call-ice-servers:
    get:
      tags:
        - calls
      summary: Get ICE servers for WebRTC calls
      description: Returns the node-configured TURN server when this node exposes a calls relay. Otherwise it returns TURN URLs only from signed call relay records whose peer is a currently connected circuit relay; unrelated or disconnected relay records are ignored. Local temporary credentials require a private CALLS_TURN_SHARED_SECRET matching the local coturn server. Private-network v2 relays issue their own credentials over an authenticated encrypted stream, so different deployments keep independent secrets. Missing or known public local secrets disable local credential issuance and relay publication, but do not prevent fetching credentials from eligible v2 owners. Explicit static credentials remain supported for local TURN URLs only. The default response uses iceTransportPolicy all so clients can fall back to direct ICE candidates when an advertised TURN service is unreachable. Operators may explicitly configure relay only after verifying coturn reachability. Nodes with local TURN URLs and a private shared secret publish signed call relay records through the IPFS pubsub network. Local requests issue a fresh lifetime; remote v2 credentials are reused until thirty seconds before their ten-minute expiry while connection eligibility is rechecked; clients must fetch again before ICE restart and never cache temporary credentials beyond the Unix expiry in the username. V1 shared pools require the same secret on every selected server. V2 issuance is limited per peer and globally and credentials are never published through gossip. Rotate environment secrets with a coordinated issuer and coturn restart; seamless rotation is not guaranteed. Newer issuedAt replaces older relay URLs even when the new record expires sooner.
      operationId: getCallIceServers
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: ICE server configuration for the authenticated client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallIceServersResource'
  /past-calls:
    get:
      tags:
        - calls
      summary: List conversation call history for the authenticated identity
      description: Requires current conversation membership. Community voice-channel histories are not exposed.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque cursor returned as nextCursor. It is not a capability and grants no access; a cursor from another list or a malformed one is refused with 400 (code 400110).
      operationId: getPastCalls
      responses:
        default:
          $ref: '../open-api.yaml#/components/responses/Error'
        '200':
          description: Conversation call history for a currently authorized participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallHistoryResource'
        '414':
          $ref: '../open-api.yaml#/components/responses/RequestTargetTooLong'
components:
  parameters:
    CallId:
      in: path
      name: callId
      required: true
      schema:
        type: string
        format: uuid
    CallCapability:
      in: header
      name: Authorization
      required: false
      description: "`Bearer <capability>` for a `group_capability` call, the capability (base64url, 20 to 128 characters) whose SHA-256 is the call's `capabilityHash`. A joined participant may omit it. A missing, malformed or wrong capability reads as call not found."
      schema:
        type: string
        pattern: '^Bearer [A-Za-z0-9_-]{20,128}$'
  schemas:
    PatchCallParticipantBody:
      type: object
      required:
        - mediaConnections
      properties:
        mediaConnections:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/CallParticipantMediaConnectionInput'
    CallParticipantMediaConnectionInput:
      type: object
      required:
        - remoteIdentityId
        - state
      properties:
        remoteIdentityId:
          type: string
        state:
          type: string
          enum: [new, connecting, connected, disconnected, failed, closed]
        localCandidateType:
          type: string
          enum: [host, srflx, prflx, relay]
        remoteCandidateType:
          type: string
          enum: [host, srflx, prflx, relay]
        relayUrl:
          type: string
        protocol:
          type: string
        relayProtocol:
          type: string
    CallMutationBody:
      type: object
      required:
        - at
        - mutation
      properties:
        at:
          type: integer
          minimum: 0
          description: Epoch milliseconds the participant claims for the record. Must not be more than 10 minutes in the future.
        mutation:
          type: object
          description: Participant-signed PublicMutationProof (store calls, kind put, record call_participant or call_end). See docs/api.md for the byte-exact contract.
    PostCallBody:
      type: object
      required:
        - scopeType
        - nonce
        - startedAt
        - mutation
      properties:
        scopeType:
          type: string
          enum:
            - conversation
            - community_channel
            - group_capability
        conversationId:
          type: string
          description: Required when scopeType is conversation. One-to-one conversations only; a group conversation is refused (409 InvalidCallScopeError).
        capabilityHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Required when scopeType is group_capability. Lowercase hex SHA-256 of the MLS-derived capability; the capability itself never reaches the node at start.
        networkId:
          type: string
          format: uuid
          description: Required when scopeType is group_capability. A network the creator belongs to; every node of it replicates the call.
        communityId:
          type: string
          format: uuid
          description: Required when scopeType is community_channel.
        channelId:
          type: string
          format: uuid
          description: Required when scopeType is community_channel. Must be a community voice channel.
        sessionEpoch:
          type: integer
          minimum: 1
          description: Required when scopeType is community_channel. At most one above the highest epoch known for the channel.
        nonce:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,128}$'
          description: Client-chosen nonce. The call id derives from the creator and this nonce.
        startedAt:
          type: integer
          minimum: 0
          description: Epoch milliseconds the creator claims for the start. Must not be more than 10 minutes in the future.
        mutation:
          type: object
          description: Creator-signed PublicMutationProof (store calls, kind put, record call_start). See docs/api.md for the byte-exact contract.
    PostCallSignalBody:
      type: object
      required:
        - recipientIdentityId
        - signalType
        - payload
      properties:
        recipientIdentityId:
          type: string
        signalType:
          type: string
          enum:
            - offer
            - answer
            - ice_candidate
        payload:
          type: object
          additionalProperties: true
    CallSignalDeliveryResource:
      type: object
      required:
        - expiresAt
        - signalId
      properties:
        expiresAt:
          type: integer
          format: int64
          description: Epoch milliseconds after which retries stop.
        signalId:
          type: string
          format: uuid
    CallResource:
      type: object
      required:
        - id
        - networkId
        - participantIds
        - participants
        - scope
        - status
      properties:
        id:
          type: string
          format: uuid
        networkId:
          type: string
          format: uuid
        creatorIdentityId:
          type: string
          description: Conversation caller only; omitted for community voice channels.
        participantIds:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/CallScope'
        status:
          type: string
          enum:
            - active
            - ended
            - missed
        participants:
          type: array
          items:
            $ref: '#/components/schemas/CallParticipant'
        createdAt:
          type: number
          description: Conversation lifecycle only; omitted for community voice channels.
        endedByIdentityId:
          type: string
          description: Present only for ended conversation calls.
        endedAt:
          type: number
          nullable: true
        supersededByCallId:
          type: string
          description: >-
            Present only on an ended community voice channel call that lost a
            concurrent start; the id of the winning call of the same channel,
            which its participants join.
    CallsResource:
      type: object
      required:
        - calls
      properties:
        calls:
          type: array
          items:
            $ref: '#/components/schemas/CallResource'
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page; null unless the page is full.
    CallIceServersResource:
      type: object
      required:
        - iceServers
        - iceTransportPolicy
        - diagnostics
      properties:
        iceServers:
          type: array
          items:
            $ref: '#/components/schemas/CallIceServer'
        iceTransportPolicy:
          type: string
          enum:
            - all
            - relay
        diagnostics:
          $ref: '#/components/schemas/CallIceServersDiagnostics'
    CallIceServersDiagnostics:
      type: object
      required:
        - turnSharedSecretConfigured
        - turnSource
        - nonPublicTurnUrls
      description: Configuration diagnostics only; no active reachability or credential check is performed. turnSharedSecretConfigured indicates whether a local private shared secret is set; remote v2 credentials may be available even when false. turnSource describes candidate URLs even when credentials are unavailable. nonPublicTurnUrls flags common private IP and local hostname forms; these may be reachable over LAN or VPN.
      properties:
        turnSharedSecretConfigured:
          type: boolean
        turnSource:
          type: string
          enum:
            - local-configuration
            - connected-relay-record
            - none
        nonPublicTurnUrls:
          type: array
          items:
            type: string
    CallIceServer:
      type: object
      required:
        - urls
      properties:
        urls:
          type: array
          items:
            type: string
        username:
          type: string
          description: Locally issued v1 usernames use Unix-expiry-seconds:identityId; their lifetime defaults to 3600 seconds and invalid or fractional TTL values fall back to that default. Private-network v2 relay owners issue Unix-expiry-seconds:opaque-peer-subject usernames with a fixed ten-minute lifetime. Eligible v2 credentials are cached until thirty seconds before expiry or a newer signed advertisement; each request does not renew them. Static local values are also supported. Expiry governs new authentication, not immediate termination of existing allocations.
        credential:
          type: string
          description: Temporary coturn REST HMAC credential generated locally for v1 or by the connected private-network relay owner for v2, or an explicitly configured local static value. Independent v2 owners keep separate master secrets and deliver temporary credentials over encrypted authenticated streams.
    CallScope:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - conversation
            - community_channel
            - group_capability
        conversationId:
          type: string
        capabilityHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        communityId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
    CallParticipant:
      type: object
      additionalProperties: false
      required: [connected, identityId, status]
      properties:
        connected:
          type: boolean
          description: >-
            A current runtime lease exists for this authorized participant. A
            node that just started presents a joined participant whose lease it
            has not heard yet as joined but not connected for five seconds after
            its call projection becomes ready.
        identityId:
          type: string
        status:
          type: string
          enum: [ringing, joined]
    CallHistoryResource:
      type: object
      required: [calls]
      properties:
        calls:
          type: array
          items:
            type: object
            required:
              [
                id,
                networkId,
                creatorIdentityId,
                createdAt,
                scope,
                status,
                participantIds,
                participants,
              ]
            properties:
              id:
                type: string
              networkId:
                type: string
              creatorIdentityId:
                type: string
              createdAt:
                type: number
              endedAt:
                type: number
              endedByIdentityId:
                type: string
              scope:
                $ref: '#/components/schemas/CallScope'
              status:
                type: string
                enum: [active, ended, missed]
              participantIds:
                type: array
                items:
                  type: string
              participants:
                type: array
                items:
                  $ref: '#/components/schemas/HistoricalCallParticipant'
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page; null unless the page is full.
    HistoricalCallParticipant:
      type: object
      required: [identityId, status, connected]
      properties:
        identityId:
          type: string
        status:
          type: string
          enum: [ringing, joined, left, declined, missed]
        connected:
          type: boolean
          enum: [false]
        joinedAt:
          type: number
        leftAt:
          type: number
        declinedAt:
          type: number
        missedAt:
          type: number
    CallParticipantMediaConnection:
      allOf:
        - $ref: '#/components/schemas/CallParticipantMediaConnectionInput'
        - type: object
          required:
            - usesRelay
          properties:
            usesRelay:
              type: boolean
