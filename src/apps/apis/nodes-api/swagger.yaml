openapi: 3.0.3
info:
  title: Pigeon-swarm Nodes API
  version: 1.0.0
  description: Endpoints for reading and managing the local node.
tags:
  - name: nodes
paths:
  /client-contract:
    get:
      tags:
        - nodes
      summary: Discover the client compatibility contract
      description: Public declarative metadata. apiVersion is the implemented breaking-major client API contract, not the node software version or an operator setting. Clients must reject unsupported versions. No executable code or code URLs are returned.
      security: []
      responses:
        '200':
          description: Implemented client API contract. Responses must not be cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientContractResource'
  /node:
    get:
      tags:
        - nodes
      summary: Get local node information
      responses:
        '200':
          description: Local node information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResource'
  /node/relay-configuration:
    get:
      tags:
        - nodes
      summary: Get local node relay configuration
      description: Returns relay settings owned by the local node. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Local node relay configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRelayConfigurationResource'
        '403':
          description: The authenticated identity is not the node owner.
    put:
      tags:
        - nodes
      summary: Replace local node relay configuration
      description: Configures public relay advertising, public relay discovery, private relay ports, private relay record publication/discovery, public host, and manual relay multiaddrs. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRelayConfigurationResource'
      responses:
        '200':
          description: Relay configuration replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRelayConfigurationResource'
        '403':
          description: The authenticated identity is not the node owner. A write still in flight when the node changes hands is refused the same way.
        '409':
          description: The relay configuration is invalid.
  /node/blocks:
    get:
      tags:
        - nodes
      summary: Get the node block list
      description: Returns the owner-signed block list, or null when none was stored. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: The stored block list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeBlocksResource'
        '403':
          description: The authenticated identity is not the node owner (code 403010).
    put:
      tags:
        - nodes
      summary: Replace the node block list
      description: Stores a block list signed by the current node owner. Blocked identities get 403 with code 403012 on identity-signed requests; blocked node peer ids cannot connect. The owner is never blocked. X-Signature signs the canonical request with the X-Body-Hash string as its body, so the signature, timestamp, replay, block, owner and single-upload checks all run before any body byte is read. The body is then streamed, reading stops once it exceeds NODE_BLOCK_LIST_MAX_BYTES or NODE_BLOCK_LIST_BODY_TIMEOUT_MS, and it is parsed only when its bytes hash to X-Body-Hash. There is no entry cap.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XBodyHash'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeBlockList'
      responses:
        '200':
          description: The stored block list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeBlocksResource'
        '400':
          description: The body is not JSON or not a block list document, or it blocks an identity id that is not the canonical encoding of a usable key (code 400080).
        '401':
          description: The signed request is invalid, stale or replayed, X-Body-Hash is malformed, or the body does not hash to X-Body-Hash (code 401020); a signed header is missing (code 401021).
        '403':
          description: The authenticated identity is not the node owner (code 403010).
        '408':
          description: The body was not received within NODE_BLOCK_LIST_BODY_TIMEOUT_MS (code 408010).
        '409':
          description: The list is not signed by the owner of the node as it is stored (a handover landing first refuses it), its signature does not verify, or its version is not higher than the stored one.
        '413':
          description: The body exceeds NODE_BLOCK_LIST_MAX_BYTES (code 413010).
        '429':
          description: Another block list upload is in progress (code 429060).
  /node/blocks/publication:
    get:
      tags:
        - nodes
      summary: Get whether the own block list is published
      description: Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: The publication setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeBlockPublicationResource'
        '403':
          description: The authenticated identity is not the node owner (code 403010).
    put:
      tags:
        - nodes
      summary: Publish or unpublish the own block list
      description: Publication is off by default. While on, GET /node/published-blocks serves the stored own block list unless that list names an alias of a key, in which case it is kept and not published. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeBlockPublicationResource'
      responses:
        '200':
          description: The stored publication setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeBlockPublicationResource'
        '403':
          description: The authenticated identity is not the node owner (code 403010). A write still in flight when the node changes hands is refused the same way.
  /node/published-blocks:
    get:
      tags:
        - nodes
      summary: Get the published own block list
      description: Public. Returns the stored own block list as the exact bytes its owner signed, the RFC 8785 canonical JSON of the document without identitySignature, and the signature in the X-Identity-Signature header, so a subscriber verifies the bytes against the identity it pinned before parsing them.
      responses:
        '200':
          description: The canonical JSON bytes the owner signed.
          headers:
            X-Identity-Signature:
              description: Owner signature over "pigeon:node-block-list:v1\n" followed by the response body bytes. Exposed to browsers through Access-Control-Expose-Headers.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedNodeBlockList'
        '404':
          description: Publication is off, no list is stored, or the stored list names an alias of a key (code 404040). The owner lifts the alias hold by signing a clean list (only canonical ids) at a version above the stored one and storing it with PUT /node/blocks; an equal or lower version is refused with 409. Publication stays on.
  /node/block-sources:
    get:
      tags:
        - nodes
      summary: List adopted block sources
      description: Returns every adopted source with its fetch diagnostics and counts. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: The adopted sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeBlockSourcesResource'
        '403':
          description: The authenticated identity is not the node owner (code 403010).
  /node/block-sources/{ownerIdentityId}:
    put:
      tags:
        - nodes
      summary: Adopt or reconfigure a block source
      description: Adopts the list ownerIdentityId publishes at {origin}/node/published-blocks, pinned to that identity, or changes its origin or autoApply. Turning autoApply on approves nothing already pending; it applies the lists fetched from then on. A list whose version is not above the highest one ever accepted from that publisher, even before a removal or owner reset, is refused. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/OwnerIdentityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [origin, autoApply]
              properties:
                origin:
                  type: string
                  description: A bare https origin, such as https://node.example.
                autoApply:
                  type: boolean
      responses:
        '200':
          description: The adopted source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeBlockSourceResource'
        '400':
          description: The body is invalid, or ownerIdentityId is not the canonical encoding of a usable key (code 400080); nothing is stored.
        '403':
          description: The authenticated identity is not the node owner (code 403010). A write still in flight when the node changes hands is refused the same way.
        '409':
          description: The origin is not a bare https origin (code InvalidNodeBlockSourceOriginError).
    delete:
      tags:
        - nodes
      summary: Stop following a block source
      description: Its entries stop applying at once. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/OwnerIdentityId'
      responses:
        '200':
          description: The remaining sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeBlockSourcesResource'
        '400':
          description: ownerIdentityId is not the canonical encoding of a usable key (code 400080), checked after the owner; nothing is removed.
        '403':
          description: The authenticated identity is not the node owner (code 403010). A write still in flight when the node changes hands is refused the same way.
        '409':
          description: The source is not adopted (code NodeBlockSourceNotFoundError).
  /node/block-sources/{ownerIdentityId}/pending-entries:
    get:
      tags:
        - nodes
      summary: List the entries of a source that wait for review
      description: Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/OwnerIdentityId'
      responses:
        '200':
          description: The pending entries of the latest fetched version.
          content:
            application/json:
              schema:
                type: object
                required: [ownerIdentityId, version, blockedIdentityIds, blockedNodePeerIds]
                properties:
                  ownerIdentityId:
                    type: string
                  version:
                    type: integer
                    nullable: true
                  blockedIdentityIds:
                    type: array
                    items:
                      type: string
                  blockedNodePeerIds:
                    type: array
                    items:
                      type: string
        '400':
          description: ownerIdentityId is not the canonical encoding of a usable key (code 400080), checked after the owner; no source is read.
        '403':
          description: The authenticated identity is not the node owner (code 403010).
        '409':
          description: The source is not adopted (code NodeBlockSourceNotFoundError).
  /node/block-sources/{ownerIdentityId}/approvals:
    post:
      tags:
        - nodes
      summary: Approve pending entries of a source
      description: Approves every pending entry of version (all true, no named entries) or only the named ones (all false, at least one named entry). Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/OwnerIdentityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, all]
              properties:
                version:
                  type: integer
                  minimum: 1
                all:
                  type: boolean
                blockedIdentityIds:
                  type: array
                  items:
                    type: string
                blockedNodePeerIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: The source after the approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeBlockSourceResource'
        '400':
          description: The body is invalid, or ownerIdentityId or a named blockedIdentityIds entry is not the canonical encoding of a usable key (code 400080); nothing is stored.
        '403':
          description: The authenticated identity is not the node owner (code 403010). A write still in flight when the node changes hands is refused the same way.
        '409':
          description: A newer version was fetched (NodeBlockSourceVersionHasChangedError), a named entry is not in that version (NodeBlockEntriesAreNotListedBySourceError), all and the named entries disagree (InvalidNodeBlockSourceApprovalError), or the source is not adopted (NodeBlockSourceNotFoundError).
  /node/block-exceptions:
    get:
      tags:
        - nodes
      summary: Get the local block exceptions
      description: Identities and node peer ids that adopted lists never block. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: The local exceptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeBlockExceptionsResource'
        '403':
          description: The authenticated identity is not the node owner (code 403010).
    put:
      tags:
        - nodes
      summary: Replace the local block exceptions
      description: Adopted lists never block these entries; the owner's own list still does. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeBlockExceptionsResource'
      responses:
        '200':
          description: The stored exceptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeBlockExceptionsResource'
        '400':
          description: The body is invalid, or an identityIds entry is not the canonical encoding of a usable key (code 400080); nothing is stored.
        '403':
          description: The authenticated identity is not the node owner (code 403010). A write still in flight when the node changes hands is refused the same way.
  /node/diagnostics:
    put:
      tags:
        - nodes
      summary: Open a consented diagnostics session
      description: Starts recording redacted content-retrieval diagnostics for 1 to 60 minutes and replaces any previous session. Requires explicit consent and a signed request from the current node owner. Lines are kept in memory only, at most 1000, never written to logs, and discarded 60 minutes after the session closes or on restart.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutNodeDiagnosticsBody'
      responses:
        '200':
          description: Diagnostics session opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDiagnosticsResource'
        '403':
          description: The authenticated identity is not the node owner, or the node has no owner. A write still in flight when the node changes hands is refused the same way.
        '409':
          description: Consent is missing or the duration is outside 1 to 60 minutes.
    get:
      tags:
        - nodes
      summary: Export the diagnostics session
      description: Returns the redacted lines recorded so far. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Diagnostics session export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDiagnosticsResource'
        '403':
          description: The authenticated identity is not the node owner, or the node has no owner.
        '409':
          description: No diagnostics session exists or it has been discarded.
    delete:
      tags:
        - nodes
      summary: Discard the diagnostics session
      description: Stops recording and discards every recorded line immediately. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '204':
          description: Diagnostics session discarded.
        '403':
          description: The authenticated identity is not the node owner, or the node has no owner. A write still in flight when the node changes hands is refused the same way.
  /node/networks:
    get:
      tags:
        - nodes
      summary: Get local node networks
      description: Private network keys are returned only when the request is signed by the current node owner. Unsigned, malformed, or non-owner requests still receive networks without private keys.
      parameters:
        - $ref: '#/components/parameters/XOptionalIdentityId'
        - $ref: '#/components/parameters/XOptionalTimestamp'
        - $ref: '#/components/parameters/XOptionalSignature'
      responses:
        '200':
          description: Local node networks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworksResource'
    post:
      tags:
        - nodes
      summary: Add local node network
      description: Unsigned while the node has no owner; signed by the owner once claimed. Omit `id` to let the node generate one, and omit `key` to create a public network (a client creating the node's public network sends `{"name":"public"}`). A node can only have one public network.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostNodeNetworkBody'
      responses:
        '200':
          description: Network added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworksResource'
        '403':
          description: The authenticated identity is not the node owner. A write still in flight when the node changes hands is refused the same way.
        '409':
          description: The node already has a public network.
  /node/networks/{networkId}:
    delete:
      tags:
        - nodes
      summary: Delete local node network
      description: Removes the network from the local node, stops and deletes its local IPFS storage, and removes local and replicated data scoped only to that network. Identity metadata that also belongs to other networks is kept and only loses the removed network id. Requires a signed request from the node owner; unowned nodes reject deletion because no owner can authorize the destructive operation.
      parameters:
        - in: path
          name: networkId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Network deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworksResource'
        '403':
          description: The authenticated identity is not the node owner. A write still in flight when the node changes hands is refused the same way.
        '409':
          description: The network does not exist in the local node.
  /node/owner:
    put:
      tags:
        - nodes
      summary: Put local node owner
      description: Claims an unowned node, or changes the owner when signed by the current owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutNodeOwnerBody'
      responses:
        '200':
          description: Node owner set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResource'
        '409':
          description: The current owner did not sign the request, or the identity id is not the canonical encoding of a usable Ed25519 key (code `InvalidNodeOwnerIdentityIdError`).
  /node/registration:
    put:
      tags:
        - nodes
      summary: Put local node registration mode
      description: Sets whether new identities may be created through this node. `open` (default) lets anyone who pays the admission proof create one, `codes` requires a registration code and `closed` refuses every creation, the owner's included. Only creation through this node, by `POST /identities` or by `PUT /identities/{identityId}` for an identity it does not hold yet, is gated; updates, republishing a held identity and login never are. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutNodeRegistrationBody'
      responses:
        '200':
          description: Registration mode set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRegistrationResource'
        '400':
          description: The mode is not `open`, `codes` or `closed`.
        '403':
          description: The request is not signed by the node owner or the node has no owner (code `403010`). A write still in flight when the node changes hands is refused the same way.
  /node/registration-codes:
    post:
      tags:
        - nodes
      summary: Issue a registration code
      description: Issues a registration code. The code appears only in this response; the node stores its SHA-256, the uses left and the expiry locally and never replicates them. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostNodeRegistrationCodeBody'
      responses:
        '201':
          description: 'Registration code issued. Sent with `Cache-Control: no-store`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedNodeRegistrationCodeResource'
        '400':
          description: '`maxUses` or `expiresAt` is out of range (code `400070`) or the body is invalid.'
        '403':
          description: The request is not signed by the node owner or the node has no owner (code `403010`). A write still in flight when the node changes hands is refused the same way.
    get:
      tags:
        - nodes
      summary: List registration codes
      description: Lists the usable registration codes without the codes themselves. Expired codes are dropped; used-up codes are hidden and kept until they expire, so a use given back by a failed creation is not lost. Requires a signed request from the current node owner.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Registration codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRegistrationCodesResource'
        '403':
          description: The request is not signed by the node owner or the node has no owner (code `403010`).
  /node/registration-codes/{codeId}:
    delete:
      tags:
        - nodes
      summary: Revoke a registration code
      description: Removes a registration code so it can no longer create identities. Revoking an unknown or already dropped code also succeeds. Requires a signed request from the current node owner.
      parameters:
        - in: path
          name: codeId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '204':
          description: Registration code revoked.
        '403':
          description: The request is not signed by the node owner or the node has no owner (code `403010`). A write still in flight when the node changes hands is refused the same way.
        '409':
          description: The code id is not a valid id.
  /peers:
    get:
      tags:
        - nodes
      summary: Get active peers
      description: Returns nodes seen through heartbeat events, live IPFS transport peers, and per-store OrbitDB convergence against currently known replication peers. Network private keys are never included. Convergence is not a global percentage because future or disconnected peers are unknowable.
      responses:
        '200':
          description: Active peers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeersResource'
components:
  parameters:
    XIdentityId:
      in: header
      name: X-Identity-Id
      required: true
      schema:
        type: string
    XOptionalIdentityId:
      in: header
      name: X-Identity-Id
      required: false
      schema:
        type: string
      description: Optional identity used with a valid request signature to decide whether private network keys can be included in GET /node/networks. Only the signed node owner receives keys.
    XOptionalTimestamp:
      in: header
      name: X-Timestamp
      required: false
      schema:
        type: string
    XOptionalSignature:
      in: header
      name: X-Signature
      required: false
      schema:
        type: string
    XTimestamp:
      in: header
      name: X-Timestamp
      required: true
      schema:
        type: string
    XSignature:
      in: header
      name: X-Signature
      required: true
      schema:
        type: string
    OwnerIdentityId:
      in: path
      name: ownerIdentityId
      required: true
      description: The publisher identity the source is pinned to.
      schema:
        type: string
    XBodyHash:
      in: header
      name: X-Body-Hash
      required: true
      description: Lowercase hex SHA-256 of the exact request body bytes. The request signature covers this value in place of the body.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
  schemas:
    NodeBlockList:
      type: object
      additionalProperties: false
      required:
        [
          type,
          ownerIdentityId,
          version,
          issuedAt,
          blockedIdentityIds,
          blockedNodePeerIds,
          identitySignature,
        ]
      properties:
        type:
          type: string
          enum: [pigeon-node-block-list]
        ownerIdentityId:
          type: string
        version:
          type: integer
          minimum: 1
        issuedAt:
          type: integer
        blockedIdentityIds:
          type: array
          items:
            type: string
        blockedNodePeerIds:
          type: array
          items:
            type: string
        identitySignature:
          type: string
          description: Owner signature over "pigeon:node-block-list:v1\n" plus the RFC 8785 canonical JSON of the document without this field.
    PublishedNodeBlockList:
      type: object
      additionalProperties: false
      description: Served as its RFC 8785 canonical JSON, byte for byte the content the owner signed.
      required:
        [
          type,
          ownerIdentityId,
          version,
          issuedAt,
          blockedIdentityIds,
          blockedNodePeerIds,
        ]
      properties:
        type:
          type: string
          enum: [pigeon-node-block-list]
        ownerIdentityId:
          type: string
        version:
          type: integer
          minimum: 1
        issuedAt:
          type: integer
        blockedIdentityIds:
          type: array
          items:
            type: string
        blockedNodePeerIds:
          type: array
          items:
            type: string
    NodeBlocksResource:
      type: object
      required: [blockList]
      properties:
        blockList:
          allOf:
            - $ref: '#/components/schemas/NodeBlockList'
          nullable: true
    NodeBlockPublicationResource:
      type: object
      additionalProperties: false
      required: [published]
      properties:
        published:
          type: boolean
    NodeBlockExceptionsResource:
      type: object
      additionalProperties: false
      required: [identityIds, nodePeerIds]
      properties:
        identityIds:
          type: array
          items:
            type: string
        nodePeerIds:
          type: array
          items:
            type: string
    NodeBlockSourceResource:
      type: object
      required:
        [
          ownerIdentityId,
          origin,
          autoApply,
          version,
          appliedCount,
          pendingCount,
          lastFetchedAt,
          lastFetchOutcome,
        ]
      properties:
        ownerIdentityId:
          type: string
        origin:
          type: string
        autoApply:
          type: boolean
        version:
          type: integer
          nullable: true
        appliedCount:
          type: integer
        pendingCount:
          type: integer
        lastFetchedAt:
          type: integer
          nullable: true
          description: Milliseconds since the epoch.
        lastFetchOutcome:
          type: string
          nullable: true
          enum:
            [
              accepted,
              not-newer,
              wrong-signer,
              non-canonical-identity-id,
              invalid-signature,
              invalid-document,
              too-large,
              redirected,
              refused-address,
              unreachable,
            ]
    NodeBlockSourcesResource:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/NodeBlockSourceResource'
    ClientContractResource:
      type: object
      additionalProperties: false
      required: [protocol, apiVersion]
      properties:
        protocol:
          type: string
          enum: [pigeon-swarm]
        apiVersion:
          type: integer
          enum: [2]
    NodeResource:
      type: object
      required:
        - id
        - registration
      properties:
        id:
          type: string
        owner:
          type: string
        registration:
          $ref: '#/components/schemas/NodeRegistrationResource'
    NodeRegistrationResource:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - open
            - codes
            - closed
    PutNodeRegistrationBody:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - open
            - codes
            - closed
    PostNodeRegistrationCodeBody:
      type: object
      required:
        - expiresAt
      properties:
        maxUses:
          type: integer
          minimum: 1
          default: 1
          description: At most `NODE_REGISTRATION_CODE_MAX_USES` (default 100).
        expiresAt:
          type: integer
          description: Milliseconds since epoch, in the future and at most `NODE_REGISTRATION_CODE_MAX_TTL_DAYS` (default 30) days ahead.
    IssuedNodeRegistrationCodeResource:
      type: object
      required:
        - id
        - code
        - maxUses
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: 32 random bytes, base64url. Returned only once.
        maxUses:
          type: integer
        expiresAt:
          type: integer
    NodeRegistrationCodeResource:
      type: object
      required:
        - id
        - maxUses
        - usesLeft
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        maxUses:
          type: integer
        usesLeft:
          type: integer
        expiresAt:
          type: integer
    NodeRegistrationCodesResource:
      type: object
      required:
        - codes
      properties:
        codes:
          type: array
          items:
            $ref: '#/components/schemas/NodeRegistrationCodeResource'
    NetworkResource:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          description: Optional network id. The node generates one when omitted.
        name:
          type: string
        key:
          type: string
          description: Present only when the caller identity in X-Identity-Id is the node owner, or when returned by owner-only write operations.
    NetworksResource:
      type: object
      required:
        - networks
      properties:
        networks:
          type: array
          items:
            $ref: '#/components/schemas/NetworkResource'
    NodePrivateRelayConfigurationResource:
      type: object
      required:
        - discoveryEnabled
        - enabled
        - publicationEnabled
      properties:
        discoveryEnabled:
          type: boolean
          description: Allows private networks to discover published private relay records.
        enabled:
          type: boolean
        portStart:
          type: number
          description: Required when enabled is true.
        portEnd:
          type: number
          description: Required when enabled is true.
        publicationEnabled:
          type: boolean
          description: Allows the private relay server to publish encrypted private relay records.
    NodeCallsRelayConfigurationResource:
      type: object
      properties:
        port:
          type: number
          description: TURN listening port used to derive local call relay URLs from publicHost.
    NodePublicNetworkConfigurationResource:
      type: object
      required:
        - enabled
        - port
      properties:
        enabled:
          type: boolean
          description: Enables a stable public libp2p endpoint for this node.
        port:
          type: number
          description: Public libp2p TCP port announced with publicHost when enabled.
    PutNodeDiagnosticsBody:
      type: object
      required:
        - consent
        - minutes
      properties:
        consent:
          type: boolean
          description: Must be true. The owner consents to recording redacted diagnostics.
        minutes:
          type: integer
          minimum: 1
          maximum: 60
    NodeDiagnosticsResource:
      type: object
      required:
        - openedAt
        - closesAt
        - discardsAt
        - entries
      properties:
        openedAt:
          type: integer
          description: Milliseconds since epoch.
        closesAt:
          type: integer
          description: Recording stops at this time, in milliseconds since epoch.
        discardsAt:
          type: integer
          description: The session and its lines are discarded at this time, in milliseconds since epoch.
        entries:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 2000
          description: Redacted content-retrieval lines. CIDs, provider and sender IDs are keyed digests.
    NodeRelayConfigurationResource:
      type: object
      required:
        - callsRelay
        - manualRelayMultiaddrs
        - privateRelay
        - publicNetwork
      properties:
        callsRelay:
          $ref: '#/components/schemas/NodeCallsRelayConfigurationResource'
        manualRelayMultiaddrs:
          type: array
          items:
            type: string
          description: Full libp2p multiaddrs manually configured as relay/bootstrap fallbacks.
        privateRelay:
          $ref: '#/components/schemas/NodePrivateRelayConfigurationResource'
        publicHost:
          type: string
          description: DNS name or IPv4 address used when announcing public network, private relay and call relay addresses.
        publicNetwork:
          $ref: '#/components/schemas/NodePublicNetworkConfigurationResource'
    PeerResource:
      type: object
      required:
        - id
        - lastSeenAt
        - networks
      properties:
        capabilities:
          $ref: '#/components/schemas/PeerCapabilitiesResource'
        connectionSummary:
          $ref: '#/components/schemas/PeerConnectionSummaryResource'
        id:
          type: string
        owner:
          type: string
        lastSeenAt:
          type: number
        networks:
          type: array
          items:
            $ref: '#/components/schemas/PeerNetworkResource'
        nodeType:
          type: string
          enum:
            - leaf
            - reachable
            - relay
            - unknown
    PeerCapabilitiesResource:
      type: object
      required:
        - privateIpfs
        - publicIpfs
        - relay
      properties:
        privateIpfs:
          type: boolean
        publicIpfs:
          type: boolean
        relay:
          type: boolean
    PeerConnectionSummaryResource:
      type: object
      required:
        - isSharedNetworkPeer
        - sharedNetworkCount
      properties:
        isSharedNetworkPeer:
          type: boolean
        sharedNetworkCount:
          type: number
    PeerNetworkResource:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          description: Optional network id. The node generates one when omitted.
        name:
          type: string
    ConnectedIpfsPeerNetworkResource:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - private
            - public
    ConnectedIpfsPeerResource:
      type: object
      required:
        - id
        - networks
      properties:
        id:
          type: string
          description: Connected libp2p peer id. This is not necessarily the node id because the peer may not have sent a node heartbeat yet.
        networks:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedIpfsPeerNetworkResource'
    NetworkSynchronizationStoreResource:
      type: object
      required:
        - name
        - peerIds
        - state
      properties:
        name:
          type: string
        peerIds:
          type: array
          description: OrbitDB peers that completed the head exchange for this store.
          items:
            type: string
        state:
          $ref: '#/components/schemas/NetworkSynchronizationState'
    NetworkSynchronizationState:
      type: string
      enum:
        - converged
        - syncing
        - waiting_for_peers
    NetworkCommunityState:
      type: string
      description: >-
        Content comparison against peers. `converged` means the same community
        state as this node, `diverged` different state, and `unknown` no fresh
        announcement or no local state yet.
      enum:
        - converged
        - diverged
        - unknown
    NetworkCommunityStatePeerResource:
      type: object
      required:
        - peerId
        - state
      properties:
        peerId:
          type: string
          description: Peer id claimed by the announcing node. Diagnostic only.
        state:
          $ref: '#/components/schemas/NetworkCommunityState'
    NetworkCommunityStateResource:
      type: object
      description: >-
        Per-network comparison of community state with every known peer. The
        compared hash, community ids and community counts are never exposed.
      required:
        - peers
        - state
      properties:
        peers:
          type: array
          items:
            $ref: '#/components/schemas/NetworkCommunityStatePeerResource'
        state:
          $ref: '#/components/schemas/NetworkCommunityState'
    NetworkSynchronizationNetworkResource:
      type: object
      required:
        - communityState
        - connectedPeerIds
        - convergedStoreCount
        - id
        - name
        - replicationPeerIds
        - state
        - stores
        - totalStoreCount
        - type
      properties:
        communityState:
          $ref: '#/components/schemas/NetworkCommunityStateResource'
        connectedPeerIds:
          type: array
          description: Peers currently connected through libp2p transport.
          items:
            type: string
        convergedStoreCount:
          type: integer
        id:
          type: string
        name:
          type: string
        replicationPeerIds:
          type: array
          description: Peers observed by at least one OrbitDB store.
          items:
            type: string
        state:
          description: >-
            `converged` only when every store joined all known replication
            peers and `communityState.state` is `converged`.
          allOf:
            - $ref: '#/components/schemas/NetworkSynchronizationState'
        stores:
          type: array
          items:
            $ref: '#/components/schemas/NetworkSynchronizationStoreResource'
        totalStoreCount:
          type: integer
        type:
          type: string
          enum:
            - private
            - public
    NetworkSynchronizationStatusResource:
      type: object
      required:
        - changedAt
        - networks
      properties:
        changedAt:
          type: number
          description: Unix timestamp in milliseconds for the last observed peer or OrbitDB membership change.
        networks:
          type: array
          items:
            $ref: '#/components/schemas/NetworkSynchronizationNetworkResource'
    PeersResource:
      type: object
      required:
        - ipfsPeers
        - networkSynchronization
        - peers
      properties:
        ipfsPeers:
          type: array
          description: Live IPFS transport peers grouped by connected network.
          items:
            $ref: '#/components/schemas/ConnectedIpfsPeerResource'
        networkSynchronization:
          $ref: '#/components/schemas/NetworkSynchronizationStatusResource'
        peers:
          type: array
          items:
            $ref: '#/components/schemas/PeerResource'
    PostNodeNetworkBody:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          description: Optional network id. The node generates one when omitted.
        name:
          type: string
        key:
          type: string
          description: Optional private network key to register a private IPFS network.
    PutNodeOwnerBody:
      type: object
      properties:
        identityId:
          type: string
