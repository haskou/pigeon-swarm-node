openapi: 3.0.3
info:
  title: Pigeon-swarm Conversations API
  version: 1.0.0
  description: Endpoints for creating, changing (client-signed operations) and reading conversations.
tags:
  - name: conversations
paths:
  /conversations:
    post:
      tags:
        - conversations
      summary: Create conversation from a client-signed conversation_created operation
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostConversationBody'
      responses:
        '200':
          description: Conversation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResource'
    get:
      tags:
        - conversations
      summary: List authenticated identity conversations
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: beforeConversationId
          schema:
            type: string
      responses:
        '200':
          description: Authenticated identity conversations page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsResource'
  /conversation-drafts:
    get:
      tags:
        - conversations
      summary: List authenticated identity conversation drafts
      description: Owner-only. Each draft is an opaque client-encrypted payload stored in the local embedded DB under an opaque client-derived key, newest first. The node never learns which conversation a draft belongs to.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Conversation drafts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDraftsResource'
  /conversation-drafts/{draftKey}:
    put:
      tags:
        - conversations
      summary: Save authenticated identity draft under an opaque key
      description: The client derives draftKey as base64url(HMAC-SHA256(owner draft key, utf8(conversationId))), so the node checks no conversation roster. Each identity keeps its 100 most recently updated drafts; saving under a new key drops the oldest others, never the draft just saved.
      parameters:
        - $ref: '#/components/parameters/DraftKey'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationDraftBody'
      responses:
        '200':
          description: Draft saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDraftResource'
        '400':
          description: encryptedPayload is missing or longer than 65536 characters.
        '409':
          description: InvalidConversationDraftKeyError.
    delete:
      tags:
        - conversations
      summary: Delete authenticated identity draft under an opaque key
      description: Deletes only the authenticated identity's draft. An unknown key succeeds.
      parameters:
        - $ref: '#/components/parameters/DraftKey'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Draft deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - draftKey
                properties:
                  draftKey:
                    type: string
        '409':
          description: InvalidConversationDraftKeyError.
components:
  parameters:
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema:
        type: string
    DraftKey:
      in: path
      name: draftKey
      required: true
      description: base64url(HMAC-SHA256(owner draft key, utf8(conversationId))), derived by the client.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
    XIdentityId:
      in: header
      name: X-Identity-Id
      required: true
      schema:
        type: string
    XTimestamp:
      in: header
      name: X-Timestamp
      required: true
      schema:
        type: string
    XSignature:
      in: header
      name: X-Signature
      required: true
      schema:
        type: string
  schemas:
    ConversationOperationBody:
      type: object
      description: >-
        Client-signed conversationOperations put. mutation signs the record
        {id, scopeType: conversation_operation, conversationId, networkId,
        authorIdentityId, action, args, parents, createdAt}; id is
        conversation:<conversationId>:op:<base64url sha256 of the canonical record without id>.
        The node rebuilds the record from the route, so the signature only verifies
        if the client signed the same change. Signing bytes are
        "pigeon:public-mutation:v2\n" + canonicalize(proof body without signature).
      required:
        - createdAt
        - parents
        - mutation
      properties:
        createdAt:
          type: integer
          minimum: 0
        parents:
          type: array
          description: Always empty. A conversation operation is a 1:1 genesis, which has no parents; a non-empty list is refused.
          items:
            type: string
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    PostConversationBody:
      type: object
      description: Creates a one-to-one conversation. Group conversations live in MLS on the clients; a group genesis is refused.
      required:
        - participantIds
        - keychainExternalIdentifier
        - networkId
        - operation
      properties:
        participantIds:
          type: array
          minItems: 1
          description: The node adds the authenticated identity, deduplicates and sorts; the genesis must have been signed with exactly that list, which must hold exactly 2 identities.
          items:
            type: string
        keychainExternalIdentifier:
          type: string
        networkId:
          type: string
          format: uuid
        operation:
          $ref: '#/components/schemas/ConversationOperationBody'
    ConversationResource:
      type: object
      required:
        - adminIds
        - id
        - networkId
        - participantIds
        - type
      properties:
        adminIds:
          type: array
          description: Always empty. Group rosters live in MLS on the clients; kept because clients still read the field.
          items:
            type: string
        creatorId:
          type: string
          description: Author of the genesis operation.
        id:
          type: string
          example: one-to-one:3bd1...
        networkId:
          type: string
          format: uuid
        participantIds:
          type: array
          items:
            type: string
        type:
          type: string
          enum:
            - one-to-one
    ConversationsResource:
      type: object
      required:
        - conversations
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ConversationResource'
        nextBeforeConversationId:
          type: string
    SignedPublicMutation:
      type: object
      description: Client-signed intent for a replicated public record. The node holds no user private keys, so the UI signs it. payloadDigest commits to the record without its proof; author.deviceCredential must be an authorized device of author.identityId in its device-authorization chain at author.authorizationRevision (not the current head; see docs/design/causal-device-authorization.md). The winner of concurrent mutations is the higher sequence, then the lower digest; no wall clock is used.
      required:
        - version
        - operationId
        - kind
        - store
        - recordId
        - payloadDigest
        - predecessor
        - sequence
        - author
        - signature
      properties:
        version:
          type: integer
          enum: [2]
        operationId:
          type: string
        kind:
          type: string
          enum: [put, delete]
        store:
          type: string
        recordId:
          type: string
        payloadDigest:
          type: string
        frontier:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
          description: Digests of the community operations observed when signing, strictly ascending. Required, and only allowed, on records scoped to a community (channel messages and their reactions and pins, invites, membership requests, moderation log, MLS records, polls); the record's permission is judged against the community folded at exactly this frontier. Read it from GET /communities/{id}/frontier before signing.
        predecessor:
          type: string
          nullable: true
          description: Digest of the previous mutation. Null if and only if sequence is 0.
        sequence:
          type: integer
          minimum: 0
        author:
          type: object
          required: [identityId, deviceCredential, authorizationRevision]
          properties:
            identityId:
              type: string
            deviceCredential:
              type: string
            authorizationRevision:
              type: integer
              minimum: 0
              description: Revision of the author's device-authorization chain (GET /identity-devices/authorization) observed when signing. The device is checked against the chain at this revision, not the current head.
        signature:
          type: string
    ConversationDraftBody:
      type: object
      required:
        - encryptedPayload
      properties:
        encryptedPayload:
          type: string
          maxLength: 65536
          description: Opaque encrypted draft payload owned by the authenticated identity.
        updatedAt:
          type: integer
          nullable: true
          description: Client time in milliseconds; the node uses its current time when null or omitted.
    ConversationDraftResource:
      type: object
      required:
        - draftKey
        - encryptedPayload
        - updatedAt
      properties:
        draftKey:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        encryptedPayload:
          type: string
        updatedAt:
          type: integer
    ConversationDraftsResource:
      type: object
      required:
        - drafts
      properties:
        drafts:
          type: array
          items:
            $ref: '#/components/schemas/ConversationDraftResource'
