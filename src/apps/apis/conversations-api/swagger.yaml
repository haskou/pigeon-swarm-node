openapi: 3.0.3
info:
  title: Pigeon-swarm Conversations API
  version: 1.0.0
  description: Endpoints for creating, changing (client-signed operations) and reading conversations.
tags:
  - name: conversations
paths:
  /conversations:
    post:
      tags:
        - conversations
      summary: Create conversation from a client-signed conversation_created operation
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostConversationBody'
      responses:
        '200':
          description: Conversation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResource'
    get:
      tags:
        - conversations
      summary: List authenticated identity conversations
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: beforeConversationId
          schema:
            type: string
      responses:
        '200':
          description: Authenticated identity conversations page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsResource'
  /conversations/{conversationId}/frontier:
    get:
      tags:
        - conversations
      summary: Get the operation digests to use as parents of the next signed operation (members only)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Sorted digests no other operation names as parent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationFrontierResource'
  /conversations/{conversationId}/members:
    post:
      tags:
        - conversations
      summary: Add a member (member_added operation)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostConversationMemberBody'
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResource'
        '409':
          description: InvalidConversationOperationError or ConversationOperationLimitExceededError.
  /conversations/{conversationId}/members/me:
    delete:
      tags:
        - conversations
      summary: Leave the conversation (member_left operation)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSignedOperationBody'
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResource'
        '409':
          description: InvalidConversationOperationError or ConversationOperationLimitExceededError.
  /conversations/{conversationId}/members/{identityId}:
    delete:
      tags:
        - conversations
      summary: Remove a member (member_removed operation)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TargetIdentityId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSignedOperationBody'
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResource'
        '409':
          description: InvalidConversationOperationError or ConversationOperationLimitExceededError.
  /conversations/{conversationId}/admins/{identityId}:
    put:
      tags:
        - conversations
      summary: Promote a member to admin (admin_promoted operation, creator only)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TargetIdentityId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSignedOperationBody'
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResource'
        '409':
          description: InvalidConversationOperationError or ConversationOperationLimitExceededError.
    delete:
      tags:
        - conversations
      summary: Demote an admin (admin_demoted operation, creator only)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TargetIdentityId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSignedOperationBody'
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResource'
        '409':
          description: InvalidConversationOperationError or ConversationOperationLimitExceededError.
  /conversations/{conversationId}/messages:
    post:
      tags:
        - conversations
      summary: Send encrypted message to conversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostConversationMessageBody'
      responses:
        '200':
          description: Message accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResource'
    get:
      tags:
        - conversations
      summary: Get latest conversation messages
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: beforeMessageId
          schema:
            type: string
      responses:
        '200':
          description: Latest messages page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesResource'
  /conversations/{conversationId}/messages/read-until:
    put:
      tags:
        - conversations
      summary: Mark conversation messages as read up to a message
      description: Deletes local unread flags for the authenticated identity up to and including the given message id, then publishes a read event so other nodes can apply the same projection update.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutConversationMessagesReadUntilBody'
      responses:
        '200':
          description: Messages marked as read.
  /conversations/me/drafts:
    get:
      tags:
        - conversations
      summary: List authenticated identity conversation drafts
      description: Drafts are local embedded DB opaque encrypted payloads owned by the authenticated identity.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Conversation drafts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDraftsResource'
  /conversations/{conversationId}/draft:
    put:
      tags:
        - conversations
      summary: Save authenticated identity draft for a conversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationDraftBody'
      responses:
        '200':
          description: Draft saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDraftResource'
    delete:
      tags:
        - conversations
      summary: Delete authenticated identity draft for a conversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Draft deleted.
  /conversations/{conversationId}/pins:
    get:
      tags:
        - conversations
      summary: List pinned messages for a conversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Conversation pinned messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessagePinsResource'
  /conversations/{conversationId}/messages/{messageId}:
    get:
      tags:
        - conversations
      summary: Get one conversation message by id
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - in: path
          name: messageId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Conversation message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResource'
    delete:
      tags:
        - conversations
      summary: Delete conversation message
      description: Writes a client-signed immutable deleted-message record (store messages, recordId = body id), publishes a deletion event and removes the local IPFS block when present. Readers hide the target when a deleted message from the same author targets it. The signed record carries previousMessageIds equal to [path messageId].
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - in: path
          name: messageId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteConversationMessageBody'
      responses:
        '200':
          description: Message deletion accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResource'
    put:
      tags:
        - conversations
      summary: Edit conversation message
      description: Creates a signed edited-message tombstone with a new encrypted payload. The target message remains immutable; clients should apply the newest valid edit event for the target message.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - in: path
          name: messageId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutConversationMessageBody'
      responses:
        '200':
          description: Message edition accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResource'
  /conversations/{conversationId}/messages/{messageId}/reactions:
    post:
      tags:
        - conversations
      summary: React to a conversation message
      description: Stores a message reaction in OrbitDB replicated metadata and publishes a realtime/sync event to the other conversation participants.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - in: path
          name: messageId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationMessageReactionBody'
      responses:
        '200':
          description: Reaction stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReactionResource'
    delete:
      tags:
        - conversations
      summary: Remove a conversation message reaction
      description: Removes the authenticated participant reaction from OrbitDB replicated metadata and publishes a realtime/sync event to the other conversation participants.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - in: path
          name: messageId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationMessageReactionBody'
      responses:
        '200':
          description: Reaction removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReactionResource'
  /conversations/{conversationId}/messages/{messageId}/pin:
    post:
      tags:
        - conversations
      summary: Pin a conversation message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationMessagePinBody'
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - in: path
          name: messageId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Message pinned.
    delete:
      tags:
        - conversations
      summary: Unpin a conversation message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationMessageUnpinBody'
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - in: path
          name: messageId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Message unpinned.
  /conversations/{conversationId}/messages/{messageId}/around:
    get:
      tags:
        - conversations
      summary: Get conversation messages around one message
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - in: path
          name: messageId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - in: query
          name: before
          schema:
            type: integer
            default: 20
        - in: query
          name: after
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Message window around the requested message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesAroundResource'
  /conversations/{conversationId}/messages/{messageId}/thread:
    get:
      tags:
        - conversations
      summary: Get replies for a conversation message thread
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - in: path
          name: messageId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Messages whose replyToMessageId points to the requested message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesResource'
components:
  parameters:
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema:
        type: string
    TargetIdentityId:
      in: path
      name: identityId
      required: true
      schema:
        type: string
    XIdentityId:
      in: header
      name: X-Identity-Id
      required: true
      schema:
        type: string
    XTimestamp:
      in: header
      name: X-Timestamp
      required: true
      schema:
        type: string
    XSignature:
      in: header
      name: X-Signature
      required: true
      schema:
        type: string
  schemas:
    ConversationOperationBody:
      type: object
      description: >-
        Client-signed conversationOperations put. mutation signs the record
        {id, scopeType: conversation_operation, conversationId, networkId,
        authorIdentityId, action, args, parents, createdAt}; id is
        conversation:<conversationId>:op:<base64url sha256 of the canonical record without id>.
        The node rebuilds the record from the route, so the signature only verifies
        if the client signed the same change. Signing bytes are
        "pigeon:public-mutation:v1\n" + canonicalize(proof body without signature).
      required:
        - createdAt
        - parents
        - mutation
      properties:
        createdAt:
          type: integer
          minimum: 0
        parents:
          type: array
          description: Digests from GET /conversations/{id}/frontier; empty for the genesis. Sorted ascending, unique, at most 64.
          items:
            type: string
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    ConversationSignedOperationBody:
      type: object
      required:
        - operation
      properties:
        operation:
          $ref: '#/components/schemas/ConversationOperationBody'
    PostConversationMemberBody:
      type: object
      required:
        - identityId
        - operation
      properties:
        identityId:
          type: string
        operation:
          $ref: '#/components/schemas/ConversationOperationBody'
    ConversationFrontierResource:
      type: object
      required:
        - frontier
      properties:
        frontier:
          type: array
          items:
            type: string
    PostConversationBody:
      type: object
      required:
        - type
        - participantIds
        - keychainExternalIdentifier
        - networkId
        - operation
      properties:
        type:
          type: string
          enum:
            - group
            - one-to-one
        name:
          type: string
          description: Required when type is group. Standalone group conversation name.
        nonce:
          type: string
          description: Required when type is group. The group id is group:<base64url sha256 of canonicalize({creatorIdentityId, networkId, nonce})>.
        participantIds:
          type: array
          minItems: 1
          description: The node adds the authenticated identity, deduplicates and sorts; the genesis must have been signed with exactly that list (2 to 256 for groups, exactly 2 for one-to-one).
          items:
            type: string
        keychainExternalIdentifier:
          type: string
        networkId:
          type: string
          format: uuid
        operation:
          $ref: '#/components/schemas/ConversationOperationBody'
    ConversationResource:
      type: object
      required:
        - adminIds
        - id
        - networkId
        - participantIds
        - type
        - unreadCount
      properties:
        adminIds:
          type: array
          description: Admins of the folded roster; never includes the creator.
          items:
            type: string
        creatorId:
          type: string
          description: Author of the genesis operation.
        id:
          type: string
          example: one-to-one:3bd1...
        name:
          type: string
          description: Present for standalone group conversations.
        networkId:
          type: string
          format: uuid
        participantIds:
          type: array
          items:
            type: string
        type:
          type: string
          enum:
            - group
            - one-to-one
        unreadCount:
          type: integer
          minimum: 0
    ConversationsResource:
      type: object
      required:
        - conversations
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ConversationResource'
        nextBeforeConversationId:
          type: string
    PostConversationMessageBody:
      type: object
      required:
        - id
        - createdAt
        - encryptedPayload
        - mutation
      properties:
        id:
          type: string
        createdAt:
          type: integer
        encryptedPayload:
          type: string
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
        previousMessageIds:
          type: array
          description: Optional previous message ids used by the client to sign the message. When included in the signed payload, send the exact same array in the body. When omitted, the node uses an empty list.
          items:
            type: string
        replyToMessageId:
          type: string
          description: Optional id of the existing sent message this message replies to.
    DeleteConversationMessageBody:
      type: object
      required:
        - id
        - createdAt
        - mutation
      properties:
        id:
          type: string
          description: Client-generated id of the deleted-message record (the mutation recordId).
        createdAt:
          type: integer
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    PutConversationMessageBody:
      type: object
      required:
        - id
        - createdAt
        - encryptedPayload
        - mutation
      properties:
        id:
          type: string
          description: Client-generated id of the edited-message record (the mutation recordId).
        createdAt:
          type: integer
        encryptedPayload:
          type: string
          description: Updated encrypted payload for the target message.
        previousMessageIds:
          type: array
          description: Optional previous message ids used by the client to sign the edited payload. When omitted, the node uses an array containing the path messageId.
          items:
            type: string
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    PutConversationMessagesReadUntilBody:
      type: object
      required:
        - messageId
      properties:
        messageId:
          type: string
          description: Message id up to and including which unread flags should be removed for the authenticated identity.
    SignedPublicMutation:
      type: object
      description: Client-signed intent for a replicated public record. The node holds no user private keys, so the UI signs it. payloadDigest commits to the record without its proof; author.deviceCredential must be an authorized device of author.identityId in its current device authorization head. The winner of concurrent mutations is the higher sequence, then the lower digest; no wall clock is used.
      required:
        - version
        - operationId
        - kind
        - store
        - recordId
        - payloadDigest
        - predecessor
        - sequence
        - author
        - signature
      properties:
        version:
          type: integer
          enum: [1]
        operationId:
          type: string
        kind:
          type: string
          enum: [put, delete]
        store:
          type: string
        recordId:
          type: string
        payloadDigest:
          type: string
        predecessor:
          type: string
          nullable: true
          description: Digest of the previous mutation. Null if and only if sequence is 0.
        sequence:
          type: integer
          minimum: 0
        author:
          type: object
          required: [identityId, deviceCredential]
          properties:
            identityId:
              type: string
            deviceCredential:
              type: string
        signature:
          type: string
    ConversationMessagePinBody:
      type: object
      required: [createdAt, mutation]
      properties:
        createdAt:
          type: integer
          minimum: 0
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    ConversationMessageUnpinBody:
      type: object
      required: [mutation]
      properties:
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    ConversationMessageReactionBody:
      type: object
      required:
        - emoji
        - mutation
      properties:
        createdAt:
          type: integer
          minimum: 0
          description: Creation time committed by the mutation proof. Ignored on removal.
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
        emoji:
          type: string
          description: Emoji reaction to add or remove. Reactions are unique by conversation, message, author and emoji.
          example: 👍
    ConversationDraftBody:
      type: object
      required:
        - encryptedPayload
      properties:
        encryptedPayload:
          type: string
          description: Opaque encrypted draft payload owned by the authenticated identity.
        updatedAt:
          type: integer
    ConversationDraftResource:
      type: object
      required:
        - conversationId
        - encryptedPayload
        - updatedAt
      properties:
        conversationId:
          type: string
        encryptedPayload:
          type: string
        updatedAt:
          type: integer
    ConversationDraftsResource:
      type: object
      required:
        - drafts
      properties:
        drafts:
          type: array
          items:
            $ref: '#/components/schemas/ConversationDraftResource'
    ConversationMessagePinResource:
      type: object
      required:
        - createdAt
        - message
        - messageId
        - pinnedByIdentityId
      properties:
        createdAt:
          type: integer
        messageId:
          type: string
        pinnedByIdentityId:
          type: string
        message:
          $ref: '#/components/schemas/MessageResource'
    ConversationMessagePinsResource:
      type: object
      required:
        - conversationId
        - pins
      properties:
        conversationId:
          type: string
        pins:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessagePinResource'
    MessageReactionResource:
      type: object
      required:
        - authorIdentityId
        - createdAt
        - emoji
      properties:
        authorIdentityId:
          type: string
        createdAt:
          type: integer
        emoji:
          type: string
    MessageResource:
      type: object
      required:
        - id
        - conversationId
        - authorIdentityId
        - type
        - createdAt
        - previousMessageIds
      properties:
        id:
          type: string
        conversationId:
          type: string
        authorIdentityId:
          type: string
        type:
          type: string
        createdAt:
          type: integer
        encryptedPayload:
          type: string
        previousMessageIds:
          type: array
          items:
            type: string
        reactions:
          type: array
          description: OrbitDB replicated reactions synchronized by conversation events.
          items:
            $ref: '#/components/schemas/MessageReactionResource'
        replyToMessageId:
          type: string
        targetMessageId:
          type: string
    MessagesResource:
      type: object
      required:
        - conversationId
        - messages
      properties:
        conversationId:
          type: string
        messages:
          type: array
          description: >
            Conversation timeline items. Group conversation poll ids are also
            valid conversation message ids and can be used in later
            previousMessageIds.
          items:
            oneOf:
              - $ref: '#/components/schemas/MessageResource'
              - $ref: '#/components/schemas/ConversationCallEventResource'
              - $ref: '../polls-api/swagger.yaml#/components/schemas/Poll'
        nextBeforeMessageId:
          type: string
    ConversationCallEventResource:
      type: object
      required:
        - id
        - conversationId
        - type
        - callId
        - callEventType
        - actorIdentityId
        - createdAt
        - durationMs
      properties:
        id:
          type: string
        conversationId:
          type: string
        type:
          type: string
          enum:
            - call_event
        callId:
          type: string
        callEventType:
          type: string
          enum:
            - declined
            - ended
            - missed
        actorIdentityId:
          type: string
        createdAt:
          type: integer
        durationMs:
          type: integer
    MessagesAroundResource:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageResource'
        previousCursor:
          type: string
        nextCursor:
          type: string
