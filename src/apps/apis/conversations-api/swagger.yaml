openapi: 3.0.3
info:
  title: Pigeon-swarm Conversations API
  version: 1.0.0
  description: Endpoints for creating, changing (client-signed operations) and reading conversations.
tags:
  - name: conversations
paths:
  /conversations:
    post:
      tags:
        - conversations
      summary: Create conversation from a client-signed conversation_created operation
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostConversationBody'
      responses:
        '200':
          description: Conversation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResource'
    get:
      tags:
        - conversations
      summary: List authenticated identity conversations
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: beforeConversationId
          schema:
            type: string
      responses:
        '200':
          description: Authenticated identity conversations page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsResource'
  /conversations/{conversationId}/frontier:
    get:
      tags:
        - conversations
      summary: Get the operation digests to use as parents of the next signed operation (members only)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Sorted digests no other operation names as parent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationFrontierResource'
  /conversations/{conversationId}/members:
    post:
      tags:
        - conversations
      summary: Add a member (member_added operation)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostConversationMemberBody'
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResource'
        '409':
          description: ConversationNotFoundError, InvalidConversationOperationError, or ConversationOperationLimitExceededError.
  /conversations/{conversationId}/members/me:
    delete:
      tags:
        - conversations
      summary: Leave the conversation (member_left operation)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSignedOperationBody'
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResource'
        '409':
          description: ConversationNotFoundError, InvalidConversationOperationError, or ConversationOperationLimitExceededError.
  /conversations/{conversationId}/members/{identityId}:
    delete:
      tags:
        - conversations
      summary: Remove a member (member_removed operation)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TargetIdentityId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSignedOperationBody'
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResource'
        '409':
          description: ConversationNotFoundError, InvalidConversationOperationError, or ConversationOperationLimitExceededError.
  /conversations/{conversationId}/admins/{identityId}:
    put:
      tags:
        - conversations
      summary: Promote a member to admin (admin_promoted operation, creator only)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TargetIdentityId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSignedOperationBody'
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResource'
        '409':
          description: ConversationNotFoundError, InvalidConversationOperationError, or ConversationOperationLimitExceededError.
    delete:
      tags:
        - conversations
      summary: Demote an admin (admin_demoted operation, creator only)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TargetIdentityId'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSignedOperationBody'
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResource'
        '409':
          description: ConversationNotFoundError, InvalidConversationOperationError, or ConversationOperationLimitExceededError.
  /conversations/me/drafts:
    get:
      tags:
        - conversations
      summary: List authenticated identity conversation drafts
      description: Owner-only. Each draft is an opaque client-encrypted payload stored in the local embedded DB under an opaque client-derived key, newest first. The node never learns which conversation a draft belongs to.
      parameters:
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Conversation drafts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDraftsResource'
  /conversations/me/drafts/{draftKey}:
    put:
      tags:
        - conversations
      summary: Save authenticated identity draft under an opaque key
      description: The client derives draftKey as base64url(HMAC-SHA256(owner draft key, utf8(conversationId))), so the node checks no conversation roster. Each identity keeps its 100 most recently updated drafts; saving one more drops the oldest.
      parameters:
        - $ref: '#/components/parameters/DraftKey'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationDraftBody'
      responses:
        '200':
          description: Draft saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDraftResource'
        '409':
          description: InvalidConversationDraftKeyError.
    delete:
      tags:
        - conversations
      summary: Delete authenticated identity draft under an opaque key
      description: Deletes only the authenticated identity's draft. An unknown key succeeds.
      parameters:
        - $ref: '#/components/parameters/DraftKey'
        - $ref: '#/components/parameters/XIdentityId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: Draft deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - draftKey
                properties:
                  draftKey:
                    type: string
        '409':
          description: InvalidConversationDraftKeyError.
components:
  parameters:
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema:
        type: string
    DraftKey:
      in: path
      name: draftKey
      required: true
      description: base64url(HMAC-SHA256(owner draft key, utf8(conversationId))), derived by the client.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
    TargetIdentityId:
      in: path
      name: identityId
      required: true
      schema:
        type: string
    XIdentityId:
      in: header
      name: X-Identity-Id
      required: true
      schema:
        type: string
    XTimestamp:
      in: header
      name: X-Timestamp
      required: true
      schema:
        type: string
    XSignature:
      in: header
      name: X-Signature
      required: true
      schema:
        type: string
  schemas:
    ConversationOperationBody:
      type: object
      description: >-
        Client-signed conversationOperations put. mutation signs the record
        {id, scopeType: conversation_operation, conversationId, networkId,
        authorIdentityId, action, args, parents, createdAt}; id is
        conversation:<conversationId>:op:<base64url sha256 of the canonical record without id>.
        The node rebuilds the record from the route, so the signature only verifies
        if the client signed the same change. Signing bytes are
        "pigeon:public-mutation:v2\n" + canonicalize(proof body without signature).
      required:
        - createdAt
        - parents
        - mutation
      properties:
        createdAt:
          type: integer
          minimum: 0
        parents:
          type: array
          description: Digests from GET /conversations/{id}/frontier; empty for the genesis. Sorted ascending, unique, at most 64.
          items:
            type: string
        mutation:
          $ref: '#/components/schemas/SignedPublicMutation'
    ConversationSignedOperationBody:
      type: object
      required:
        - operation
      properties:
        operation:
          $ref: '#/components/schemas/ConversationOperationBody'
    PostConversationMemberBody:
      type: object
      required:
        - identityId
        - operation
      properties:
        identityId:
          type: string
        operation:
          $ref: '#/components/schemas/ConversationOperationBody'
    ConversationFrontierResource:
      type: object
      required:
        - frontier
      properties:
        frontier:
          type: array
          items:
            type: string
    PostConversationBody:
      type: object
      required:
        - type
        - participantIds
        - keychainExternalIdentifier
        - networkId
        - operation
      properties:
        type:
          type: string
          enum:
            - group
            - one-to-one
        name:
          type: string
          description: Required when type is group. Standalone group conversation name.
        nonce:
          type: string
          description: Required when type is group. The group id is group:<base64url sha256 of canonicalize({creatorIdentityId, networkId, nonce})>.
        participantIds:
          type: array
          minItems: 1
          description: The node adds the authenticated identity, deduplicates and sorts; the genesis must have been signed with exactly that list (2 to 256 for groups, exactly 2 for one-to-one).
          items:
            type: string
        keychainExternalIdentifier:
          type: string
        networkId:
          type: string
          format: uuid
        operation:
          $ref: '#/components/schemas/ConversationOperationBody'
    ConversationResource:
      type: object
      required:
        - adminIds
        - id
        - networkId
        - participantIds
        - type
      properties:
        adminIds:
          type: array
          description: Admins of the folded roster; never includes the creator.
          items:
            type: string
        creatorId:
          type: string
          description: Author of the genesis operation.
        id:
          type: string
          example: one-to-one:3bd1...
        name:
          type: string
          description: Present for standalone group conversations.
        networkId:
          type: string
          format: uuid
        participantIds:
          type: array
          items:
            type: string
        type:
          type: string
          enum:
            - group
            - one-to-one
    ConversationsResource:
      type: object
      required:
        - conversations
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ConversationResource'
        nextBeforeConversationId:
          type: string
    SignedPublicMutation:
      type: object
      description: Client-signed intent for a replicated public record. The node holds no user private keys, so the UI signs it. payloadDigest commits to the record without its proof; author.deviceCredential must be an authorized device of author.identityId in its device-authorization chain at author.authorizationRevision (not the current head; see docs/design/causal-device-authorization.md). The winner of concurrent mutations is the higher sequence, then the lower digest; no wall clock is used.
      required:
        - version
        - operationId
        - kind
        - store
        - recordId
        - payloadDigest
        - predecessor
        - sequence
        - author
        - signature
      properties:
        version:
          type: integer
          enum: [2]
        operationId:
          type: string
        kind:
          type: string
          enum: [put, delete]
        store:
          type: string
        recordId:
          type: string
        payloadDigest:
          type: string
        frontier:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
          description: Digests of the community or conversation operations observed when signing, strictly ascending. Required, and only allowed, on records scoped to a community or conversation (channel messages and their reactions and pins, invites, membership requests, moderation log, MLS records, polls); the record's permission is judged against the scope folded at exactly this frontier. Read it from GET /communities/{id}/frontier or the conversation frontier before signing.
        predecessor:
          type: string
          nullable: true
          description: Digest of the previous mutation. Null if and only if sequence is 0.
        sequence:
          type: integer
          minimum: 0
        author:
          type: object
          required: [identityId, deviceCredential, authorizationRevision]
          properties:
            identityId:
              type: string
            deviceCredential:
              type: string
            authorizationRevision:
              type: integer
              minimum: 0
              description: Revision of the author's device-authorization chain (GET /identity-devices/authorization) observed when signing. The device is checked against the chain at this revision, not the current head.
        signature:
          type: string
    ConversationDraftBody:
      type: object
      required:
        - encryptedPayload
      properties:
        encryptedPayload:
          type: string
          description: Opaque encrypted draft payload owned by the authenticated identity.
        updatedAt:
          type: integer
    ConversationDraftResource:
      type: object
      required:
        - draftKey
        - encryptedPayload
        - updatedAt
      properties:
        draftKey:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        encryptedPayload:
          type: string
        updatedAt:
          type: integer
    ConversationDraftsResource:
      type: object
      required:
        - drafts
      properties:
        drafts:
          type: array
          items:
            $ref: '#/components/schemas/ConversationDraftResource'
